name: Windows Release

on:
  workflow_dispatch:
    inputs:
      publisher_url:
        description: Optional production WatchLog URL for installer metadata
        required: false
        type: string
      production:
        description: Production release (requires a valid signing cert; hard-fails if unsigned)
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-real-installer:
    name: Build real AI-enabled WatchLog installer
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ vars.WATCHLOG_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.WATCHLOG_SUPABASE_PUBLISHABLE_KEY }}
      PUBLISHER_URL: ${{ inputs.publisher_url || vars.WATCHLOG_PUBLISHER_URL }}
      SIGN_PFX_B64: ${{ secrets.WATCHLOG_SIGN_PFX_B64 }}
      SIGN_PASSWORD: ${{ secrets.WATCHLOG_SIGN_PASSWORD }}
      # Tag pushes (v*) are always production: they must hard-fail without valid
      # signing (and a PublisherUrl). Manual dispatch honours the input.
      PRODUCTION: ${{ github.event_name == 'push' || inputs.production }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install NSIS
        shell: powershell
        run: choco install nsis -y --no-progress

      - name: Validate public release configuration
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SUPABASE_URL) {
            throw 'Repository variable WATCHLOG_SUPABASE_URL is required for a customer release.'
          }
          if (-not $env:SUPABASE_PUBLISHABLE_KEY) {
            throw 'Repository variable WATCHLOG_SUPABASE_PUBLISHABLE_KEY is required for a customer release.'
          }
          if ($env:SUPABASE_URL -notmatch '^https://') {
            throw 'WATCHLOG_SUPABASE_URL must be an https URL.'
          }
          Write-Host 'Public WatchLog release configuration is present.'

      - name: Build production Site Agent and NSIS installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Named (hashtable) splat — NOT an array. Array splatting binds
          # POSITIONALLY: in 0.3.3 that shifted '-SupabaseUrl' into -Code and the
          # real URL into -PublisherUrl, baking an INVALID backend URL and
          # '-SupabaseUrl' as the site code. A hashtable binds by parameter name.
          $releaseArgs = @{
            SupabaseUrl            = $env:SUPABASE_URL
            SupabasePublishableKey = $env:SUPABASE_PUBLISHABLE_KEY
          }
          if ($env:PUBLISHER_URL) { $releaseArgs['PublisherUrl'] = $env:PUBLISHER_URL }

          $pfx = $null
          try {
            if ($env:SIGN_PFX_B64) {
              if (-not $env:SIGN_PASSWORD) {
                throw 'WATCHLOG_SIGN_PFX_B64 exists but WATCHLOG_SIGN_PASSWORD is missing.'
              }
              $pfx = Join-Path $env:RUNNER_TEMP 'watchlog-signing.pfx'
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_B64))
              $releaseArgs['SignPfx'] = $pfx
              $releaseArgs['SignPassword'] = $env:SIGN_PASSWORD
            }

            if ($env:PRODUCTION -eq 'true') { $releaseArgs['Production'] = $true }
            & .\tools\build_windows_release.ps1 @releaseArgs
            if ($LASTEXITCODE -ne 0) { throw "release script failed with exit $LASTEXITCODE" }
          }
          finally {
            if ($pfx -and (Test-Path $pfx)) { Remove-Item -Force $pfx }
          }

      - name: Verify real payloads, setup UI, AI self-test and checksum
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $agent = Get-Item '.\prototype\dist\watchlog-agent.exe'
          $setupUi = Get-Item '.\prototype\dist\watchlog-setup-ui.exe'
          $setup = Get-Item '.\dist-installer\WatchLog-Setup.exe'
          $checksumPath = '.\dist-installer\WatchLog-Setup.exe.sha256'

          if ($agent.Length -lt 5MB) {
            throw "watchlog-agent.exe is too small ($($agent.Length) bytes); refusing a stub/incomplete release."
          }
          if ($setupUi.Length -lt 5MB) {
            throw "watchlog-setup-ui.exe is too small ($($setupUi.Length) bytes); refusing a stub/incomplete release."
          }
          if ($setup.Length -lt 10MB) {
            throw "WatchLog-Setup.exe is too small ($($setup.Length) bytes); refusing a stub/incomplete release."
          }
          if (-not (Test-Path $checksumPath)) { throw 'installer checksum file is missing' }

          # Prove the packaged AI runtime/model, not just the Python source tree.
          $agentSelftest = & $agent.FullName --selftest 2>&1 | Out-String
          Write-Host $agentSelftest
          if ($LASTEXITCODE -ne 0) { throw "packaged agent self-test failed with exit $LASTEXITCODE" }
          # Single version source: the PACKAGED agent must report the build version
          # (0.3.3 shipped reporting 0.3.0 from analytics_agent's stale constant). Derive the
          # expected version from wl_version.py — never hardcode it here (that would itself become a
          # second, drift-prone source, the very bug this check exists to catch).
          $wlVer = (Select-String -Path '.\prototype\agent\wl_version.py' -Pattern '^VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($agentSelftest -notmatch [regex]::Escape("watchlog-agent $wlVer")) {
            throw "packaged agent reports the wrong version (expected $wlVer):`n$agentSelftest"
          }

          # TRANSACTIONAL-UPGRADE VERSION TRUTH (real exe): the installer refuses a false success by
          # verifying BOTH the file ProductVersion AND the runtime --version equal the release. Prove
          # both against the REAL packaged exe, and prove the upgrade helper's verify-version PASSES
          # at the correct version and REJECTS a wrong one.
          $fileVer = $agent.VersionInfo.ProductVersion
          if ($fileVer -ne $wlVer) { throw "agent file ProductVersion '$fileVer' != wl_version '$wlVer'" }
          $runVer = (& $agent.FullName --version 2>$null | Select-Object -First 1).ToString().Trim()
          if ($runVer -ne $wlVer) { throw "agent --version '$runVer' != wl_version '$wlVer'" }
          Write-Host "agent version truth OK: file=$fileVer runtime=$runVer"
          $ud = Join-Path $env:RUNNER_TEMP 'wl-upg-accept'
          New-Item -ItemType Directory -Force $ud | Out-Null
          Copy-Item $agent.FullName (Join-Path $ud 'watchlog-agent.exe') -Force
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\prototype\installer\nsis\wl-upgrade.ps1 -Stage verify-version -InstallDir $ud -ExpectedVersion $wlVer
          if ($LASTEXITCODE -ne 0) { throw "wl-upgrade verify-version FAILED on the real exe at the correct version $wlVer" }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\prototype\installer\nsis\wl-upgrade.ps1 -Stage verify-version -InstallDir $ud -ExpectedVersion '9.9.9'
          if ($LASTEXITCODE -eq 0) { throw "wl-upgrade verify-version wrongly PASSED for a mismatched version" }
          Write-Host "wl-upgrade verify-version acceptance OK (real exe: passes at $wlVer, rejects 9.9.9)"

          # PACKAGED-EXE DPAPI PROOF: prove the FROZEN setup UI actually drives
          # credential_store -> DPAPI, not merely that it launches. Seed a legacy
          # watchlog.env in an isolated ProgramData, run --migrate-only, then prove a
          # real, decryptable, DACL-locked Secrets\nvr_credential.dpapi is published.
          Add-Type -AssemblyName System.Security
          Import-Module Microsoft.PowerShell.Security -ErrorAction Stop
          $origPd = $env:PROGRAMDATA
          $pd = Join-Path $env:RUNNER_TEMP 'wl-pkgproof'
          if (Test-Path $pd) { Remove-Item $pd -Recurse -Force }
          $wlDir = Join-Path $pd 'WatchLog'
          New-Item -ItemType Directory -Force $wlDir | Out-Null
          $tuser = 'pkgproof_op'
          $tpass = 'Pkg-DPAPI-Proof-9471'
          $envFile = Join-Path $wlDir 'watchlog.env'
          Set-Content -Path $envFile -Encoding ASCII -Value "WATCHLOG_NVR_PASSWORD=$tpass"
          $cfg = Join-Path $wlDir 'watchlog.ini'
          Set-Content -Path $cfg -Encoding UTF8 -Value @('[watchlog]', "nvr_username = $tuser", "supabase_url = $env:SUPABASE_URL", "supabase_publishable_key = $env:SUPABASE_PUBLISHABLE_KEY", 'nvr_driver = auto')
          try {
            $env:PROGRAMDATA = $pd
            # setup UI is a --windowed app; PowerShell's & does NOT wait for GUI-
            # subsystem exes, so the blob assertions below would race the migration.
            # Start-Process -Wait blocks until --migrate-only actually finishes.
            $mp = Start-Process -FilePath $setupUi.FullName -ArgumentList @('--migrate-only','--config',$cfg) -Wait -PassThru
            if ($mp.ExitCode -ne 0) { throw "packaged setup UI --migrate-only failed with exit $($mp.ExitCode)" }
          } finally {
            $env:PROGRAMDATA = $origPd
          }
          $blobPath = Join-Path $wlDir 'Secrets\nvr_credential.dpapi'
          if (-not (Test-Path $blobPath)) { throw 'packaged exe did not create Secrets\nvr_credential.dpapi — DPAPI store not exercised' }
          if (Test-Path $envFile) { throw 'legacy watchlog.env was not removed after migration' }
          $blobBytes = [IO.File]::ReadAllBytes($blobPath)
          function Test-ByteSubseq($hay, $needle) {
            for ($i=0; $i -le $hay.Length - $needle.Length; $i++) {
              $m=$true; for ($j=0; $j -lt $needle.Length; $j++) { if ($hay[$i+$j] -ne $needle[$j]) { $m=$false; break } }
              if ($m) { return $true }
            }
            return $false
          }
          if ((Test-ByteSubseq $blobBytes ([Text.Encoding]::UTF8.GetBytes($tpass))) -or (Test-ByteSubseq $blobBytes ([Text.Encoding]::Unicode.GetBytes($tpass)))) {
            throw 'plaintext recorder password found inside the DPAPI blob'
          }
          $plain = [System.Security.Cryptography.ProtectedData]::Unprotect($blobBytes, $null, [System.Security.Cryptography.DataProtectionScope]::LocalMachine)
          $obj = [Text.Encoding]::UTF8.GetString($plain) | ConvertFrom-Json
          if ($obj.username -ne $tuser) { throw "decrypted username '$($obj.username)' != '$tuser'" }
          if ($obj.password -ne $tpass) { throw 'decrypted password does not match the seeded value' }
          if (-not $obj.credential_version) { throw 'decrypted credential is missing credential_version' }
          foreach ($p in @((Join-Path $wlDir 'Secrets'), $blobPath)) {
            $acl = Get-Acl -LiteralPath $p
            $owner = $acl.GetOwner([System.Security.Principal.SecurityIdentifier]).Value
            if ($owner -notin @('S-1-5-18','S-1-5-32-544')) { throw "$p owner $owner is not SYSTEM/Administrators" }
            if (-not $acl.AreAccessRulesProtected) { throw "$p inheritance is not disabled" }
            foreach ($r in $acl.Access) {
              if ($r.AccessControlType -eq 'Allow') {
                $sid = $r.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value
                if ($sid -notin @('S-1-5-18','S-1-5-32-544')) { throw "$p grants unexpected principal $sid" }
              }
            }
          }
          Remove-Item $pd -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "  Packaged-EXE DPAPI proof PASSED: frozen setup UI -> credential_store -> DPAPI."
          Write-Host "    username=$($obj.username) credential_version=$($obj.credential_version) plaintext-in-blob=NO owner/DACL=SYSTEM+Admins"
          # Best-effort direct version echo (a windowed exe's console-attach may
          # not be pipe-captured on the runner; the agent self-test above and the
          # shared wl_version.py are the authoritative proof the setup UI is 0.3.4).
          $setupUiVersion = (& $setupUi.FullName --version 2>&1 | Out-String).Trim()
          Write-Host "Setup UI --version (best-effort console echo): '$setupUiVersion'"

          # Authoritative version proof: PE VERSIONINFO ProductVersion on all three
          # executables must equal wl_version.py — no windowed-console tricks.
          $wlVer = (Select-String -Path '.\prototype\agent\wl_version.py' -Pattern '^VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          foreach ($item in @($agent, $setupUi, $setup)) {
            $pv = "$($item.VersionInfo.ProductVersion)".Trim()
            Write-Host "  $($item.Name) ProductVersion = '$pv'"
            if ($pv -ne $wlVer) { throw "$($item.Name) ProductVersion '$pv' != wl_version '$wlVer'" }
          }
          Write-Host "All three executables report ProductVersion $wlVer."

          $expected = ((Get-Content $checksumPath -Raw).Trim() -split '\s+')[0].ToUpperInvariant()
          $actual = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($expected -ne $actual) {
            throw "SHA-256 mismatch: expected $expected, actual $actual"
          }

          Write-Host "Verified real agent: $([math]::Round($agent.Length / 1MB, 1)) MB"
          Write-Host "Verified setup UI: $([math]::Round($setupUi.Length / 1MB, 1)) MB"
          Write-Host "Verified installer: $([math]::Round($setup.Length / 1MB, 1)) MB"
          Write-Host "Verified SHA-256: $actual"

          # RECORDED RELEASE IDENTITY (RC hashes): emit a CI-attested manifest of the
          # INNER agent exe, the setup UI exe and the installer. The installer .sha256
          # already pins WatchLog-Setup.exe, but the inner watchlog-agent.exe hash is
          # otherwise unrecoverable from the artifact — capture all three here so the RC's
          # exact identity is attested by the gated build, never transcribed by hand.
          $agentHash = (Get-FileHash $agent.FullName -Algorithm SHA256).Hash.ToUpperInvariant()
          $setupUiHash = (Get-FileHash $setupUi.FullName -Algorithm SHA256).Hash.ToUpperInvariant()
          $manifestLines = @(
            "WatchLog Windows release manifest",
            "version=$wlVer",
            "source_sha=$env:GITHUB_SHA",
            "run_id=$env:GITHUB_RUN_ID",
            "run_number=$env:GITHUB_RUN_NUMBER",
            "workflow_ref=$env:GITHUB_REF",
            "watchlog-agent.exe.sha256=$agentHash",
            "watchlog-setup-ui.exe.sha256=$setupUiHash",
            "WatchLog-Setup.exe.sha256=$actual"
          )
          $manifestPath = '.\dist-installer\WatchLog-Release.hashes.txt'
          Set-Content -Path $manifestPath -Encoding ASCII -Value $manifestLines
          Write-Host '---- RECORDED RELEASE HASHES (RC identity) ----'
          $manifestLines | ForEach-Object { Write-Host $_ }
          Write-Host '-----------------------------------------------'

      - name: Upload WatchLog Windows release
        uses: actions/upload-artifact@v4
        with:
          name: WatchLog-Windows-${{ github.run_number }}
          path: |
            dist-installer/WatchLog-Setup.exe
            dist-installer/WatchLog-Setup.exe.sha256
            dist-installer/WatchLog-Release.hashes.txt
          if-no-files-found: error
          retention-days: 30
