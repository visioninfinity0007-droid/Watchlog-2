name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test deps
        run: python -m pip install --quiet pillow requests numpy onnxruntime tzdata pytest xhtml2pdf
      - name: Compile all Python
        run: python -m compileall -q prototype tools
      - name: Agent identity + camera enrollment tests
        run: python -m pytest prototype/tests/test_camera_enrollment.py prototype/tests/test_credential_store.py -q
      - name: Phase A model + store tests (health/coverage/inventory/nvr/camera/reconcile/store/faults)
        run: python -m pytest prototype/tests/test_health_model.py prototype/tests/test_coverage_model.py prototype/tests/test_inventory_model.py prototype/tests/test_nvr_health.py prototype/tests/test_camera_health.py prototype/tests/test_reconcile_model.py prototype/tests/test_health_store.py prototype/tests/test_recording_model.py prototype/tests/test_recording_health.py prototype/tests/test_reconcile_split.py prototype/tests/test_fault_model.py prototype/tests/test_apply_migrations.py -q
      - name: WordPress PHP syntax
        run: |
          php -l deploy/wordpress/themes/watchlog/front-page.php
          php -l deploy/wordpress/themes/watchlog/page-platform.php
          php -l deploy/wordpress/themes/watchlog/page-security.php
          php -l deploy/wordpress/themes/watchlog/page-solutions.php
      - name: Secret scan (tracked tree)
        run: python tools/secret_scan.py
      - name: Migration lint
        run: python tools/lint_migrations.py
      - name: Health Foundation schema/authz contract (Phase A)
        run: python prototype/tests/test_health_foundation_contract.py
      - name: Agent watchdog + coverage contract (Phase A)
        run: python prototype/tests/test_agent_watchdog_contract.py
      - name: Packaged agent run-dispatch contract (crash-loop / channels-drift guard)
        run: python prototype/tests/test_agent_run_dispatch.py
      - name: Agent log-hygiene contract (never log enrollment code / agent key)
        run: python prototype/tests/test_agent_log_hygiene.py
      - name: Agent health report (NVR/inventory) contract (Phase A)
        run: python prototype/tests/test_health_report_contract.py
      - name: Camera health report contract (Phase A)
        run: python prototype/tests/test_camera_health_report_contract.py
      - name: Health reconciliation contract (Phase A)
        run: python prototype/tests/test_health_reconciliation_contract.py
      - name: Recording/storage report contract (Phase A)
        run: python prototype/tests/test_recording_storage_contract.py
      - name: Operational faults + read-model contract (Phase A)
        run: python prototype/tests/test_operational_faults_contract.py
      - name: Operations Intelligence contract (0049 — generic rule/incident engine)
        run: python prototype/tests/test_operations_intelligence_contract.py
      - name: Native-NVR AI + incident-footage contract (Security Intelligence 0040/0041)
        run: python prototype/tests/test_native_nvr_incident_evidence.py
      - name: SaaS operations security contract
        run: python prototype/tests/test_saas_operations_contract.py
      - name: Customer lifecycle contract
        run: python prototype/tests/test_customer_lifecycle_contract.py
      - name: Customer portal language contract
        run: python prototype/tests/test_customer_portal_language.py
      - name: Control Room security/product contract
        run: python prototype/tests/test_control_room_contract.py
      - name: Control Room reporting contract
        run: python prototype/tests/test_control_room_reporting_contract.py
      - name: Production preflight read-only contract
        run: python prototype/tests/test_watchlog_production_preflight.py
      - name: Deployment smoke read-only contract
        run: python prototype/tests/test_watchlog_deployment_smoke.py
      - name: Auth redirect + recovery contract
        run: python prototype/tests/test_auth_flow_contract.py
      - name: Vision false-alarm filter tests
        run: python prototype/tests/test_vision_filter.py
      - name: Analytics Studio local rule-engine tests
        run: python prototype/tests/test_analytics_engine.py
      - name: Operations Intelligence runtime — generic primitives (engine)
        run: python prototype/tests/test_ops_runtime.py
      - name: Multi-agent lease client — fencing + fail-safe
        run: python prototype/tests/test_lease_client.py
      - name: Recorder connection hardening — ports/HTTPS/discovery/trust
        run: python prototype/tests/test_recorder_probe.py
      - name: Evidence action runtime — truthful unsupported
        run: python prototype/tests/test_action_runtime.py
      - name: Archive runtime — reprocess + honest retrieval
        run: python prototype/tests/test_archive_runtime.py
      - name: Agent runtime orchestration end-to-end — engine+lease+actions+archive composed
        run: python prototype/tests/test_agent_runtime_e2e.py
      - name: Recorder hardware-probe harness — honest capability report + read-only + auth gate
        run: python prototype/tests/test_hardware_probe.py
      - name: Old-agent forward-compatibility — frozen production engine vs the 0054-0059 server
        run: python prototype/tests/test_old_agent_compat.py
      - name: Analytics sampler capacity tests
        run: python prototype/tests/test_analytics_sampler.py
      - name: Analytics Studio report rendering tests
        run: python prototype/tests/test_analytics_reporting.py
      - name: Reports preview truth contract
        run: python prototype/tests/test_reports_preview_truth.py
      - name: Analytics portal alignment contract
        run: python prototype/tests/test_analytics_portal_contract.py
      - name: Portal + installer alignment contract
        run: python prototype/tests/test_portal_alignment_contract.py
      - name: Intelligence agent + reporting units (native-verify, config-drift, offline-spool, PDF, WhatsApp)
        run: python -m pytest prototype/tests/test_native_verification.py prototype/tests/test_config_drift.py prototype/tests/test_spool_offline.py prototype/tests/test_intelligence_pdf.py prototype/tests/test_intelligence_whatsapp.py -q
      - name: Backfill + advisor + monthly units (backfill, AI site-config skill, monthly render)
        run: python -m pytest prototype/tests/test_backfill.py prototype/tests/test_site_config_advisor.py prototype/tests/test_intelligence_monthly.py -q
      - name: Canonical report unification + operational PDF (one dataset -> portal/WhatsApp/PDF, real PDF)
        run: python -m pytest prototype/tests/test_intelligence_report.py -q
      - name: Report pipeline contract (n8n -> runner -> idempotent delivery)
        run: python prototype/tests/test_report_pipeline_contract.py
      - name: Site Control portal capability-aware UX contract
        run: python prototype/tests/test_site_control_portal_contract.py
      - name: Branded Windows installer product contract
        run: python prototype/tests/test_windows_installer_product.py
      - name: Platform admin contract gate
        run: python prototype/tests/test_platform_admin_contract.py
      - name: Recorder-push parser tests
        run: python prototype/tests/test_push_bridge.py
      - name: Capability-probe tests
        run: python prototype/tests/test_capabilities.py
      - name: Vendor capability matrix contract (honest — no fabricated capability)
        run: python prototype/tests/test_vendor_capability_matrix.py
      - name: Email template tests
        run: python prototype/tests/test_email_template.py
      - name: ONNX inference test (skips if model absent)
        run: python prototype/tests/test_vision_onnx.py
      - name: Pricing alignment (website == billing)
        run: python prototype/tests/test_pricing_alignment.py
      - name: Public website claims + maturity contract
        run: python prototype/tests/test_public_claims_contract.py
      - name: No em dashes in public-site copy
        run: python tools/check_no_emdash.py
    # Live tenant isolation, billing authz, team/trial, analytics API and
    # platform-admin denial checks need a disposable Supabase target. CI must
    # never mutate production.

  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Production build (static export)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  setup-ui-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build branded windowed setup executable
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          powershell -ExecutionPolicy Bypass -File prototype\agent\build_setup_gui.ps1
          $exe = Get-Item prototype\dist\watchlog-setup-ui.exe
          if ($exe.Length -lt 5MB) { throw "setup UI is too small: $($exe.Length)" }
      - name: Exercise DPAPI round trip and migration mode
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONPATH = (Resolve-Path prototype\agent).Path
          # DPAPI crypto round trip — the 0.3.4 store is a BYTES API (the old str
          # signature raised TypeError). Pure protect/unprotect, no DACL/elevation.
          python -c "from windows_secret import protect_bytes, unprotect_bytes; b=b'recorder-test-secret'; assert unprotect_bytes(protect_bytes(b)) == b; print('DPAPI round trip OK')"
          if ($LASTEXITCODE -ne 0) { throw "DPAPI round trip failed: $LASTEXITCODE" }
          # Real migration: seed a legacy watchlog.env in an isolated ProgramData and
          # prove the frozen setup UI migrates it into the encrypted split store
          # (a blank config would be a no-op that proves nothing about the store).
          $pd = Join-Path $env:RUNNER_TEMP "wl-ci-migrate"
          if (Test-Path $pd) { Remove-Item $pd -Recurse -Force }
          $wl = Join-Path $pd "WatchLog"; New-Item -ItemType Directory -Force $wl | Out-Null
          Set-Content -Path (Join-Path $wl "watchlog.env") -Encoding ASCII -Value "WATCHLOG_NVR_PASSWORD=ci-legacy-pw"
          $cfg = Join-Path $wl "watchlog.ini"
          Set-Content -Path $cfg -Encoding UTF8 -Value @('[watchlog]', 'nvr_username = ci_op', 'supabase_url = https://example.supabase.co', 'supabase_publishable_key = ci-placeholder', 'nvr_driver = auto')
          $origPd = $env:PROGRAMDATA
          try {
            $env:PROGRAMDATA = $pd
            # setup UI is a --windowed app; PowerShell's & does NOT wait for GUI-
            # subsystem exes, so the blob check would race the migration. Start-Process
            # -Wait blocks until --migrate-only actually finishes.
            $mp = Start-Process -FilePath (Resolve-Path prototype\dist\watchlog-setup-ui.exe).Path -ArgumentList @('--migrate-only','--config',$cfg) -Wait -PassThru
            if ($mp.ExitCode -ne 0) { throw "setup UI migration mode failed: $($mp.ExitCode)" }
          } finally { $env:PROGRAMDATA = $origPd }
          if (-not (Test-Path (Join-Path $wl "Secrets\nvr_credential.dpapi"))) { throw "migration did not create the encrypted credential" }
          if (Test-Path (Join-Path $wl "watchlog.env")) { throw "legacy watchlog.env not removed after migration" }
          Remove-Item $pd -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "DPAPI round trip + real legacy migration verified."

  installer-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NSIS
        shell: powershell
        run: choco install nsis -y --no-progress
      - name: Compile NSIS release manifest with explicit stub payloads
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:RUNNER_TEMP "watchlog-nsis-contract"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item prototype\installer\nsis\watchlog.nsi (Join-Path $stage "watchlog.nsi")
          Copy-Item prototype\installer\run-agent.ps1 (Join-Path $stage "run-agent.ps1")
          Copy-Item prototype\installer\register-service.ps1 (Join-Path $stage "register-service.ps1")
          Copy-Item prototype\installer\nsis\wl-upgrade.ps1 (Join-Path $stage "wl-upgrade.ps1")
          Copy-Item "prototype\installer\READ ME FIRST.txt" (Join-Path $stage "READ ME FIRST.txt")
          Copy-Item prototype\installer\setup.ico (Join-Path $stage "setup.ico")
          # Syntax contract only: the real release workflow separately builds
          # and size-checks both executables before publishing an artifact.
          [IO.File]::WriteAllBytes((Join-Path $stage "watchlog-agent.exe"), [byte[]](0))
          [IO.File]::WriteAllBytes((Join-Path $stage "watchlog-setup-ui.exe"), [byte[]](0))
          @"
          [watchlog]
          supabase_url = https://example.supabase.co
          supabase_publishable_key = ci-placeholder
          enrollment_code =
          nvr_driver = auto
          "@ | Set-Content (Join-Path $stage "watchlog.defaults.ini") -Encoding UTF8
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { $makensis = (Get-Command makensis).Source }
          Push-Location $stage
          & $makensis "/DICON=setup.ico" "watchlog.nsi"
          $rc = $LASTEXITCODE
          Pop-Location
          if ($rc -ne 0) { throw "makensis failed with exit $rc" }
          if (-not (Test-Path (Join-Path $stage "WatchLog-Setup.exe"))) { throw "NSIS output missing" }
      - name: Transactional upgrade helper tests (locked-EXE gate, version truth, rollback, targeted kill)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File prototype\tests\test_wl_upgrade.ps1
          if ($LASTEXITCODE -ne 0) { throw "wl-upgrade transactional tests failed ($LASTEXITCODE)" }

  # Real Postgres execution of the health migrations (0042-0048): the static contract tests regex the
  # SQL, but this applies every migration to a DISPOSABLE Postgres and drives the RPCs with real rows —
  # the first time the health SQL actually executes. Never touches production (a throwaway service DB).
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SUPABASE_DB_HOST: localhost
      SUPABASE_DB_PORT: "5432"
      SUPABASE_DB_USER: postgres
      SUPABASE_DB_PASSWORD: postgres
      SUPABASE_DB_NAME: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install psycopg + psql client
        run: |
          python -m pip install --quiet "psycopg[binary]"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Supabase-shim prelude (roles, auth schema, auth.uid) on the disposable Postgres
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f prototype/supabase/ci_prelude.sql
      - name: Apply migrations 0001..0048 to the disposable Postgres
        run: python prototype/supabase/apply_migrations.py
      - name: Health foundation integration — real RPC execution (0042-0048)
        run: python prototype/tests/e2e_health_pg.py
      - name: Incident footage integration — real RPC execution + authz (0040/0041)
        run: python prototype/tests/e2e_incident_pg.py
      - name: Migration runner integrity — CRLF idempotence + fail-closed drift (disposable Postgres)
        run: python prototype/tests/test_apply_migrations_pg.py
      - name: Operations Intelligence integration — rule versioning + incident lifecycle + authz (0049)
        run: python prototype/tests/e2e_operations_pg.py
      - name: Management report integration — executive report + completeness truth (0050)
        run: python prototype/tests/e2e_report_pg.py
      - name: Archive scan integration — bounded scan + recovered-provenance + separation (0051)
        run: python prototype/tests/e2e_archive_pg.py
      - name: Multi-agent lease/fencing integration — single authority + failover (0052)
        run: python prototype/tests/e2e_multiagent_pg.py
      - name: Agent config governance integration — governance travels to the runtime (0056)
        run: python prototype/tests/e2e_config_governance_pg.py
      - name: Operations rule authoring integration — every primitive Studio->RPC->DB->config->engine (0057)
        run: python prototype/tests/e2e_operations_authoring_pg.py
      - name: Incident evidence integration — bounded stills + rule-authorized footage, authz + idempotency (0058)
        run: python prototype/tests/e2e_incident_evidence_pg.py
      - name: Runtime capability + Operations gate integration — default-OFF safety + capability advertisement (0059)
        run: python prototype/tests/e2e_runtime_capability_pg.py
      - name: Intelligence pipeline integration — Activity/Episode/Incident grouping + per-site promotion + provenance (0065)
        run: python prototype/tests/e2e_intelligence_pg.py
      - name: Canonical daily-intelligence dataset integration — one dataset for portal/PDF/WhatsApp + tenant guard (0067)
        run: python prototype/tests/e2e_daily_intelligence_pg.py
      - name: Alert engine integration — dedup + severity threshold + atomic claim (0068)
        run: python prototype/tests/e2e_alert_engine_pg.py
      - name: Monthly rollup integration — month aggregate over the intelligence layers (0069)
        run: python prototype/tests/e2e_monthly_rollup_pg.py
      - name: Recorder capability KB integration — 18-model resolver verdicts, honest unknown (0066)
        run: python prototype/tests/e2e_capability_kb_pg.py
      - name: Journeys integration — multi-camera movement paths + provenance + idempotency (0070)
        run: python prototype/tests/e2e_journeys_pg.py
      - name: Intelligence RPC tenant-isolation integration — daily/monthly/journeys/policies (0067-0071)
        run: python prototype/tests/e2e_intelligence_authz_pg.py
      - name: Onboarding + business context integration (0072)
        run: python prototype/tests/e2e_onboarding_pg.py
      - name: Visitor/staff inference integration — multi-factor, ambiguous + overlapping (0073)
        run: python prototype/tests/e2e_entity_inference_pg.py
      - name: Daily intelligence v2 integration — sustained opening/closing, generic after-hours/restricted (0074)
        run: python prototype/tests/e2e_daily_intelligence_v2_pg.py
      - name: Health->incident->alert delivery chain integration — dedup/recovery/retry (0075)
        run: python prototype/tests/e2e_alert_delivery_pg.py
      - name: Report calibration integration — reviewer feedback + config tuning (0076)
        run: python prototype/tests/e2e_calibration_pg.py
      - name: Offline sync idempotency integration — server half of the resilience cycle
        run: python prototype/tests/e2e_offline_sync_pg.py
      - name: Recorder capability KB batch 3 already covered; demo/acceptance preflight integration (0078)
        run: python prototype/tests/e2e_preflight_pg.py
      - name: Daily-intelligence WhatsApp delivery pipeline integration — idempotency + retry (item 8)
        run: python prototype/tests/e2e_intelligence_delivery_pg.py
      - name: Site/recorder diagnosis integration — capability-aware, tenant-guarded (0079)
        run: python prototype/tests/e2e_site_diagnosis_pg.py

  # PRODUCTION-ORDER simulation: production is already at 0001-0039 + 0042-0048 WITHOUT 0040/0041, so the
  # real upgrade applies 0040/0041 out of numeric order on top of 0048. The `integration` job above applies
  # 0001..0048 in numeric order (a clean install) and does NOT exercise that path. This job reproduces the
  # exact production order and proves the incident lifecycle works AND Phase-A health is undisturbed.
  integration-prod-order:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SUPABASE_DB_HOST: localhost
      SUPABASE_DB_PORT: "5432"
      SUPABASE_DB_USER: postgres
      SUPABASE_DB_PASSWORD: postgres
      SUPABASE_DB_NAME: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install psycopg + psql client
        run: |
          python -m pip install --quiet "psycopg[binary]"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Supabase-shim prelude (roles, auth schema, auth.uid) on the disposable Postgres
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f prototype/supabase/ci_prelude.sql
      - name: Production-order simulation (0042-0048 baseline -> 0040/0041 -> incident lifecycle -> health smoke)
        run: bash prototype/tests/prod_order_integration.sh
