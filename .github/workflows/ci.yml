    # never mutate production.

  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Production build (static export)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  portal-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Customer portal language contract
        run: python prototype/tests/test_customer_portal_language.py
      - name: Owner portal design-system contract
        run: python prototype/tests/test_portal_design_system_contract.py
      - name: Auth redirect + confirmation truth contract
        run: python prototype/tests/test_auth_flow_contract.py
      - name: Portal alignment contract
        run: python prototype/tests/test_portal_alignment_contract.py
      - name: Ask WatchLog production contract
        run: python prototype/tests/test_ai_first_production_contract.py
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Site-type intelligence contract
        run: python prototype/tests/test_site_type_intelligence_contract.py
      - name: Multi-recorder owner portal contract
        run: python prototype/tests/test_multi_recorder_portal_contract.py
      - name: Multi-recorder portal surfaces (System Health root cause, Site Control per recorder, Watch AI card)
        run: python prototype/tests/test_portal_recorder_surfaces.py
      - name: Watch AI customer harness contract
        run: python prototype/tests/test_watch_ai_customer_harness.py

  setup-ui-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # build_setup_gui.ps1 freezes in a fresh venv from the hash-locked Setup UI lock,
          # which targets the release interpreter exactly.
          python-version: '3.12.10'
      - name: Build branded windowed setup executable
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          powershell -ExecutionPolicy Bypass -File prototype\agent\build_setup_gui.ps1
          $exe = Get-Item prototype\dist\watchlog-setup-ui.exe
          if ($exe.Length -lt 5MB) { throw "setup UI is too small: $($exe.Length)" }
      - name: Exercise DPAPI round trip and migration mode
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONPATH = (Resolve-Path prototype\agent).Path
          # DPAPI crypto round trip — the 0.3.4 store is a BYTES API (the old str
          # signature raised TypeError). Pure protect/unprotect, no DACL/elevation.
          python -c "from windows_secret import protect_bytes, unprotect_bytes; b=b'recorder-test-secret'; assert unprotect_bytes(protect_bytes(b)) == b; print('DPAPI round trip OK')"
          if ($LASTEXITCODE -ne 0) { throw "DPAPI round trip failed: $LASTEXITCODE" }
          # Multi-recorder credential helper uses one independent DPAPI blob per recorder.
          python -c "import uuid, credential_store as c; rid=str(uuid.uuid4()); c.save_recorder_credential(rid,'ci-user','ci-recorder-pw'); x=c.load_recorder_credential(rid); assert x['username']=='ci-user' and x['password']=='ci-recorder-pw' and x['local_id']==rid; c.delete_recorder_credential(rid); print('per-recorder DPAPI round trip OK')"
          if ($LASTEXITCODE -ne 0) { throw "per-recorder DPAPI helper failed: $LASTEXITCODE" }
          # Real migration: seed a legacy watchlog.env in an isolated ProgramData and
          # prove the frozen setup UI migrates it into the encrypted split store
          # (a blank config would be a no-op that proves nothing about the store).
          $pd = Join-Path $env:RUNNER_TEMP "wl-ci-migrate"
          if (Test-Path $pd) { Remove-Item $pd -Recurse -Force }
          $wl = Join-Path $pd "WatchLog"; New-Item -ItemType Directory -Force $wl | Out-Null
          Set-Content -Path (Join-Path $wl "watchlog.env") -Encoding ASCII -Value "WATCHLOG_NVR_PASSWORD=ci-legacy-pw"
          $cfg = Join-Path $wl "watchlog.ini"
          Set-Content -Path $cfg -Encoding UTF8 -Value @('[watchlog]', 'nvr_username = ci_op', 'supabase_url = https://example.supabase.co', 'supabase_publishable_key = ci-placeholder', 'nvr_driver = auto')
          $origPd = $env:PROGRAMDATA
          try {
            $env:PROGRAMDATA = $pd
            # setup UI is a --windowed app; PowerShell's & does NOT wait for GUI-
            # subsystem exes, so the blob check would race the migration. Start-Process
            # -Wait blocks until --migrate-only actually finishes.
            $mp = Start-Process -FilePath (Resolve-Path prototype\dist\watchlog-setup-ui.exe).Path -ArgumentList @('--migrate-only','--config',$cfg) -Wait -PassThru
            if ($mp.ExitCode -ne 0) { throw "setup UI migration mode failed: $($mp.ExitCode)" }
          } finally { $env:PROGRAMDATA = $origPd }
          if (-not (Test-Path (Join-Path $wl "Secrets\nvr_credential.dpapi"))) { throw "migration did not create the encrypted credential" }
          if (Test-Path (Join-Path $wl "watchlog.env")) { throw "legacy watchlog.env not removed after migration" }
          Remove-Item $pd -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "DPAPI round trip + real legacy migration verified."
      - name: Exercise the frozen recorder registry selftest
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # The PACKAGED exe migrates a legacy singleton into recorders.json + a per-recorder
          # DPAPI blob, adds an independent second recorder, loads contexts with the Agent's
          # own loader and rolls the unbound one back, inside a private temporary ProgramData
          # it creates itself. No window. Start-Process -Wait: & does not wait for GUI exes.
          $result = Join-Path $env:RUNNER_TEMP "wl-registry-selftest.json"
          if (Test-Path $result) { Remove-Item $result -Force }
          $rp = Start-Process -FilePath (Resolve-Path prototype\dist\watchlog-setup-ui.exe).Path -ArgumentList @('--registry-selftest','--result-json',"`"$result`"") -Wait -PassThru
          if (-not (Test-Path $result)) { throw "frozen registry selftest wrote no result (exit $($rp.ExitCode))" }
          $body = Get-Content $result -Raw | ConvertFrom-Json
          $body.checks | Format-List | Out-String | Write-Host
          if ($rp.ExitCode -ne 0 -or -not $body.ok) { throw "frozen registry selftest failed (exit $($rp.ExitCode)): $($body.error)" }
          Write-Host "Frozen recorder registry + per-recorder DPAPI selftest PASSED."
      - name: Exercise the frozen setup UI selftest (standalone and installer child)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # The PACKAGED window runs its own flow checks, including the multi-recorder first
          # install: Add another recorder before Connect, one login and one name per recorder,
          # cameras grouped by recorder with shared channel numbers. Standalone keeps the
          # retryable login timeout; installer-child mode must close itself for NSIS.
          # Start-Process -Wait: & does not wait for GUI-subsystem exes.
          $env:QT_QPA_PLATFORM = 'offscreen'
          $exe = (Resolve-Path prototype\dist\watchlog-setup-ui.exe).Path
          foreach ($mode in @('--ui-selftest', '--ui-selftest --installer-child')) {
            $started = Get-Date
            $p = Start-Process -FilePath $exe -ArgumentList $mode -Wait -PassThru
            $elapsed = ((Get-Date) - $started).TotalSeconds
            Write-Host "frozen setup UI selftest ($mode): exit $($p.ExitCode), $([math]::Round($elapsed,1))s"
            if ($p.ExitCode -ne 0) { throw "frozen setup UI selftest ($mode) failed with exit $($p.ExitCode)" }
            # Hang guard, not a speed target: the time includes the one-file exe unpacking itself
            # (about 259 MB) on the runner's disk. 15 s measured 15.2 s and under 15 s on GitHub
            # for the same commit; a stuck installer-child window never exits at all.
            if ($elapsed -gt 30) { throw "frozen setup UI selftest ($mode) took $([math]::Round($elapsed,1))s" }
          }
          Write-Host "Frozen setup UI selftest PASSED (standalone and installer child)."
      - name: Repair/Upgrade, registry preflight/staging and elevation tests
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # They drive the real Repair/Upgrade orchestrator and upgrade helper through Windows
          # PowerShell, so they need this Windows job (the Linux backend job cannot run them).
          # The EXEs are frozen in isolated venvs, so this interpreter has none of their packages:
          # install the same hash-locked sets the tests import (Agent + Setup UI).
          python -m pip install --disable-pip-version-check --quiet --no-deps --require-hashes -r prototype/packaging/requirements-agent.lock
          if ($LASTEXITCODE -ne 0) { throw "agent lock install failed ($LASTEXITCODE)" }
          python -m pip install --disable-pip-version-check --quiet --no-deps --require-hashes -r prototype/packaging/requirements-setup-ui.lock
          if ($LASTEXITCODE -ne 0) { throw "setup UI lock install failed ($LASTEXITCODE)" }
          python -m pip install --disable-pip-version-check --quiet pytest
          if ($LASTEXITCODE -ne 0) { throw "test dependency install failed ($LASTEXITCODE)" }
          python -m pytest -q prototype/tests/test_existing_site_repair.py prototype/tests/test_setup_registry_selftest.py prototype/tests/test_setup_gui_elevation.py prototype/tests/test_pilot_hardening.py prototype/tests/test_remote_update_stage_trust.py
          if ($LASTEXITCODE -ne 0) { throw "Repair/Upgrade, registry and elevation tests failed ($LASTEXITCODE)" }
          # 5.1.1 lifecycle: per-recorder Repair gate, proven rollback, interrupted-upgrade
          # recovery, uninstall policy and power baseline, remote-update launcher rollback. They
          # run the real scripts; the runner is elevated, so task registration runs for real.
          python -m pytest -q prototype/tests/test_repair_lifecycle_gate.py prototype/tests/test_upgrade_helper_lifecycle.py prototype/tests/test_remote_update_commit_gate.py prototype/tests/test_update_contract.py prototype/tests/test_installer_lifecycle_contract.py
          if ($LASTEXITCODE -ne 0) { throw "5.1.1 installer/upgrade lifecycle tests failed ($LASTEXITCODE)" }
      - name: Repair downgrade guard under Windows PowerShell 5.1 (whole orchestrator, sandbox ProgramData)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --quiet --disable-pip-version-check pytest
          python -m pytest prototype/tests/test_repair_multi_recorder_guard.py -q
          if ($LASTEXITCODE -ne 0) { throw "Repair downgrade guard tests failed ($LASTEXITCODE)" }

  installer-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NSIS
        shell: powershell
        run: choco install nsis -y --no-progress
      - name: Compile NSIS release manifest with explicit stub payloads
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:RUNNER_TEMP "watchlog-nsis-contract"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item prototype\installer\nsis\watchlog.nsi (Join-Path $stage "watchlog.nsi")
          Copy-Item prototype\installer\run-agent.ps1 (Join-Path $stage "run-agent.ps1")
          Copy-Item prototype\installer\register-service.ps1 (Join-Path $stage "register-service.ps1")
          Copy-Item prototype\installer\apply-remote-update.ps1 (Join-Path $stage "apply-remote-update.ps1")
          Copy-Item prototype\installer\nsis\wl-upgrade.ps1 (Join-Path $stage "wl-upgrade.ps1")
          Copy-Item prototype\installer\nsis\watchlog-repair.nsi (Join-Path $stage "watchlog-repair.nsi")
          Copy-Item prototype\installer\wl-repair-upgrade.ps1 (Join-Path $stage "wl-repair-upgrade.ps1")
          Copy-Item "prototype\installer\READ ME FIRST.txt" (Join-Path $stage "READ ME FIRST.txt")
          Copy-Item prototype\installer\setup.ico (Join-Path $stage "setup.ico")
          # Syntax contract only: the real release workflow separately builds
          # and size-checks both executables before publishing an artifact.
          [IO.File]::WriteAllBytes((Join-Path $stage "watchlog-agent.exe"), [byte[]](0))
          [IO.File]::WriteAllBytes((Join-Path $stage "watchlog-setup-ui.exe"), [byte[]](0))
          @"
          [watchlog]
          supabase_url = https://example.supabase.co
          supabase_publishable_key = ci-placeholder
          enrollment_code =
          nvr_driver = auto
          "@ | Set-Content (Join-Path $stage "watchlog.defaults.ini") -Encoding UTF8
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { $makensis = (Get-Command makensis).Source }
          Push-Location $stage
          & $makensis "/DICON=setup.ico" "watchlog.nsi"
          $rc = $LASTEXITCODE
          Pop-Location
          if ($rc -ne 0) { throw "makensis failed with exit $rc" }
          if (-not (Test-Path (Join-Path $stage "WatchLog-Setup.exe"))) { throw "NSIS output missing" }
          # Repair/Upgrade used to be compiled only by the release build, so a script
          # regression merged green. Same zero-warning rule as the release build.
          Push-Location $stage
          $repairOut = & $makensis "/DICON=setup.ico" "watchlog-repair.nsi" 2>&1 | Out-String
          $repairRc = $LASTEXITCODE
          Pop-Location
          Write-Host $repairOut
          if ($repairRc -ne 0) { throw "repair makensis failed with exit $repairRc" }
          if (-not (Test-Path (Join-Path $stage "WatchLog-Repair-Upgrade.exe"))) { throw "Repair/Upgrade NSIS output missing" }
          $repairWarnings = ($repairOut -split "`r?`n") | Where-Object { $_ -match 'warning \d+:' }
          if ($repairWarnings) { throw "Repair NSIS emitted warnings:`n$($repairWarnings -join "`n")" }
      - name: Transactional upgrade helper tests (locked-EXE gate, version truth, rollback, targeted kill)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File prototype\tests\test_wl_upgrade.ps1
          if ($LASTEXITCODE -ne 0) { throw "wl-upgrade transactional tests failed ($LASTEXITCODE)" }

  # Real Postgres execution of the migration chain: static contract tests regex selected SQL,
  # while this job applies every migration to a DISPOSABLE Postgres and drives RPCs with real rows —
  # the first time the health SQL actually executes. Never touches production (a throwaway service DB).
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SUPABASE_DB_HOST: localhost
      SUPABASE_DB_PORT: "5432"
      SUPABASE_DB_USER: postgres
      SUPABASE_DB_PASSWORD: postgres
      SUPABASE_DB_NAME: postgres
      WATCHLOG_CI_PLAIN_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
