name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # The real-FFmpeg tests (clip probe, PS -> MP4 remux, frame decode) fail instead of
      # skipping when no FFmpeg is found; imageio-ffmpeg below is where the release finds it.
      WATCHLOG_REQUIRE_FFMPEG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test deps
        run: python -m pip install --quiet pillow requests numpy onnxruntime tzdata pytest xhtml2pdf cryptography pyyaml imageio-ffmpeg
      - name: Compile all Python
        run: python -m compileall -q prototype tools
      - name: Test hygiene guards (every test file runs in CI; no test writes to the real ProgramData)
        run: python -m pytest prototype/tests/test_ci_runs_every_test.py prototype/tests/test_programdata_isolation_guard.py -q
      - name: Release version contract (wl_version == NSIS fallback; release recorded in the installer source of truth)
        run: python -m pytest prototype/tests/test_release_version_contract.py -q
      - name: Windows packaging contract (hash-locked build deps, isolated venvs, Setup imports no Agent runtime, selective Qt inventory, size/payload/manifest tools, version + build SHA identity, field update bootstrap)
        run: python -m pytest prototype/tests/test_release_packaging.py prototype/tests/test_setup_import_graph.py -q
      - name: Repair downgrade guard (5.0.28 Repair refuses a multi-recorder site; reader runs under pwsh)
        run: python -m pytest prototype/tests/test_repair_multi_recorder_guard.py -q
      - name: Agent identity + camera enrollment tests
        run: python -m pytest prototype/tests/test_camera_enrollment.py prototype/tests/test_credential_store.py prototype/tests/test_recorder_registry.py prototype/tests/test_recorder_runtime.py prototype/tests/test_multi_recorder_event_identity.py prototype/tests/test_multi_recorder_health_store.py prototype/tests/test_multi_recorder_runtime_adapters.py prototype/tests/test_multi_recorder_cloud_binding.py prototype/tests/test_multi_recorder_camera_job_runtime.py prototype/tests/test_multi_recorder_analytics_runtime.py prototype/tests/test_multi_recorder_fanout.py prototype/tests/test_multi_recorder_continuity.py prototype/tests/test_recorder_manager.py prototype/tests/test_legacy_credential_registry_site.py -q
      - name: Multi-recorder first install (Setup add-another path, per-recorder rows, credentials, binding and cameras; Manage Recorders kept events; installer-child wiring; unknown vendor/model stays unknown)
        run: python -m pytest prototype/tests/test_multi_recorder_initial_install.py prototype/tests/test_setup_gui_multi_recorder_flow.py prototype/tests/test_manage_recorders_retained_events.py prototype/tests/test_installer_child_wiring.py prototype/tests/test_setup_unknown_recorder_identity.py -q
      - name: Phase A model + store tests (health/coverage/inventory/nvr/camera/reconcile/store/faults)
        run: python -m pytest prototype/tests/test_health_model.py prototype/tests/test_coverage_model.py prototype/tests/test_inventory_model.py prototype/tests/test_nvr_health.py prototype/tests/test_camera_health.py prototype/tests/test_reconcile_model.py prototype/tests/test_health_store.py prototype/tests/test_recording_model.py prototype/tests/test_recording_health.py prototype/tests/test_reconcile_split.py prototype/tests/test_fault_model.py prototype/tests/test_apply_migrations.py -q
      - name: WordPress PHP syntax
        run: |
          php -l deploy/wordpress/themes/watchlog/front-page.php
          php -l deploy/wordpress/themes/watchlog/page-platform.php
          php -l deploy/wordpress/themes/watchlog/page-security.php
          php -l deploy/wordpress/themes/watchlog/page-solutions.php
      - name: Secret scan (tracked tree)
        run: python tools/secret_scan.py
      - name: Agent 5.0.27 repair gates
        run: |
          python prototype/tests/test_agent_run_dispatch.py
          python prototype/tests/test_native_nvr_incident_evidence.py
          python -m pytest prototype/tests/test_recovery.py prototype/tests/test_recovery_wiring.py prototype/tests/test_recovery_ai.py prototype/tests/test_*archive*.py prototype/tests/test_build_metadata.py -q
      - name: Multi-recorder Agent with the 5.0.28 live-site fixes (worker survival, last_live, stream liveness, recovery claims, redaction, singleton worker survival, recovery RPC contract, per-recorder periodic stills and ONVIF stream reporting)
        run: python -m pytest prototype/tests/test_fanout_stream_last_live.py prototype/tests/test_health_worker_survival.py prototype/tests/test_recorder_recovery_rules.py prototype/tests/test_incident_routed_recorder_redaction.py prototype/tests/test_fanout_recovery_worker_survival.py prototype/tests/test_fanout_quiet_stream_liveness.py prototype/tests/test_worker_exception_survival.py prototype/tests/test_recovery_rpc_contract.py prototype/tests/test_recovery_recorder_release.py prototype/tests/test_fanout_periodic_stills.py prototype/tests/test_fanout_onvif_stream_liveness.py -q
      - name: Multi-recorder registry trust, same-site reinstall, secondary disable, single-recorder job routing, claimed-command completion
        run: python -m pytest prototype/tests/test_registry_trust.py prototype/tests/test_recorder_registry_reinstall.py prototype/tests/test_disable_secondary_runtime.py prototype/tests/test_single_recorder_job_routing.py prototype/tests/test_claimed_command_completion.py -q
      - name: Multi-recorder failure isolation (bounded spool stamp, per-recorder footage workers, sampler backoff, recorder recording proof, credential reload, channel-level sampler backoff, footage claim behind a backlog, busy registry write, busy registry during binding, address-swap identity refusal, channel-keyed analytics profile)
        run: python -m pytest prototype/tests/test_multi_recorder_spool_stamp_bounded.py prototype/tests/test_incident_footage_recorder_isolation.py prototype/tests/test_analytics_sampler_backoff.py prototype/tests/test_recording_current_multi_recorder.py prototype/tests/test_worker_credential_reload.py prototype/tests/test_analytics_sampler_channel_isolation.py prototype/tests/test_incident_footage_claim_backlog.py prototype/tests/test_multi_recorder_identity_write_race.py prototype/tests/test_recorder_identity_address_swap.py prototype/tests/test_analytics_bootstrap_multi_recorder.py prototype/tests/test_registry_busy_during_binding.py -q
      - name: Recorder push per recorder, Agent/bridge alarm parity, Site Control recorder routing and read catalog
        run: python -m pytest prototype/tests/test_recorder_push_scoped.py prototype/tests/test_recorder_push_setup.py prototype/tests/test_push_bridge.py prototype/tests/test_push_bridge_dahua.py prototype/tests/test_site_control.py prototype/tests/test_site_control_recorder_routing.py -q
      - name: Agent 5.0.28 live-site gates (ONVIF driver, incident evidence, event streams, recovery wiring)
        run: |
          python -m pytest prototype/tests/test_onvif_*.py prototype/tests/test_incident_*.py -q
          python -m pytest prototype/tests/test_event_stream_liveness.py prototype/tests/test_shipped_last_live.py prototype/tests/test_native_collector_reconnect.py prototype/tests/test_shipped_spool_cap.py prototype/tests/test_collector_recorder_scope.py prototype/tests/test_event_json_channel.py prototype/tests/test_probe_recorder_scoped_event.py -q
          python -m pytest prototype/tests/test_hikvision_event_time.py prototype/tests/test_hikvision_burst_clock.py prototype/tests/test_hikvision_alert_channel.py prototype/tests/test_hikvision_alarm_input_scope.py prototype/tests/test_hikvision_targets.py prototype/tests/test_hikvision_auth_downgrade.py prototype/tests/test_hikvision_snapshot_outcomes.py prototype/tests/test_hikvision_field_safety.py prototype/tests/test_remote_update_stage_trust.py prototype/tests/test_dahua_event_time.py prototype/tests/test_dahua_burst_clock.py prototype/tests/test_dahua_recorder_scoped_events.py prototype/tests/test_dahua_auth_downgrade.py prototype/tests/test_dahua_push_safety.py prototype/tests/test_capability_sync_deferred.py prototype/tests/test_fresh_install_readiness.py prototype/tests/test_site_runtime_isolation.py prototype/tests/test_credential_fault_visibility.py prototype/tests/test_upload_rejected_rows.py prototype/tests/test_server_owned_stills.py prototype/tests/test_console_setup_retired.py prototype/tests/test_registry_site_isolation.py prototype/tests/test_durable_writes.py prototype/tests/test_release_perf_gate.py -q
          python -m pytest prototype/tests/test_recovery_hikvision_terminal.py -q
          python -m pytest prototype/tests/test_periodic_stills.py prototype/tests/test_periodic_stills_recorder_identity.py -q
      - name: Migration lint
        run: python tools/lint_migrations.py
      - name: Stale incident clip recovery contract (0142, applied in production)
        run: python -m pytest prototype/tests/test_incident_clip_stale_recovery.py -q
      - name: Production-only migrations contract (0144/0145, recovered from the production ledger)
        run: python -m pytest prototype/tests/test_production_only_migrations.py -q
      - name: Stale incident still recovery contract — server-side still lease schedule (0150, MNVR-033)
        run: python -m pytest prototype/tests/test_incident_still_stale_recovery.py -q
      - name: Production ledger reconciliation contract (32 already-live files, runner sha256)
        run: python -m pytest prototype/tests/test_ledger_reconciliation.py -q
      - name: Health Foundation schema/authz contract (Phase A)
        run: python prototype/tests/test_health_foundation_contract.py
      - name: Agent watchdog + coverage contract (Phase A)
        run: python prototype/tests/test_agent_watchdog_contract.py
      - name: Packaged agent run-dispatch contract (crash-loop / channels-drift guard)
        run: python prototype/tests/test_agent_run_dispatch.py
      - name: Agent log-hygiene contract (never log enrollment code / agent key)
        run: python prototype/tests/test_agent_log_hygiene.py
      - name: Agent health report (NVR/inventory) contract (Phase A)
        run: python prototype/tests/test_health_report_contract.py
      - name: Camera health report contract (Phase A)
        run: python prototype/tests/test_camera_health_report_contract.py
      - name: Health reconciliation contract (Phase A)
        run: python prototype/tests/test_health_reconciliation_contract.py
      - name: Recording/storage report contract (Phase A)
        run: python prototype/tests/test_recording_storage_contract.py
      - name: Operational faults + read-model contract (Phase A)
        run: python prototype/tests/test_operational_faults_contract.py
      - name: Multi-recorder current proof + fault contract (latest SQL definitions)
        run: python -m pytest prototype/tests/test_multi_recorder_fault_contract.py -q
      - name: E2E gates test the final migration chain (no stale migration re-run)
        run: python -m pytest prototype/tests/test_e2e_no_stale_migration_rerun.py -q
      - name: Operations Intelligence contract (0049 — generic rule/incident engine)
        run: python prototype/tests/test_operations_intelligence_contract.py
      - name: Native-NVR AI + incident-footage contract (Security Intelligence 0040/0041)
        run: python prototype/tests/test_native_nvr_incident_evidence.py
      - name: SaaS operations security contract
        run: python prototype/tests/test_saas_operations_contract.py
      - name: Customer lifecycle contract
        run: python prototype/tests/test_customer_lifecycle_contract.py
      - name: Customer portal language contract
        run: python prototype/tests/test_customer_portal_language.py
      - name: Owner portal design-system contract
        run: python prototype/tests/test_portal_design_system_contract.py
      - name: Control Room security/product contract
        run: python prototype/tests/test_control_room_contract.py
      - name: Control Room reporting contract
        run: python prototype/tests/test_control_room_reporting_contract.py
      - name: Production preflight read-only contract
        run: python prototype/tests/test_watchlog_production_preflight.py
      - name: Deployment smoke read-only contract
        run: python prototype/tests/test_watchlog_deployment_smoke.py
      - name: Auth redirect + recovery contract
        run: python prototype/tests/test_auth_flow_contract.py
      - name: Private visual snapshot pipeline contract
        run: python prototype/tests/test_visual_snapshot_pipeline_contract.py
      - name: Camera preview realtime contract
        run: python prototype/tests/test_camera_preview_realtime_contract.py
      - name: Vision false-alarm filter tests
        run: python prototype/tests/test_vision_filter.py
      - name: Analytics Studio local rule-engine tests
        run: python prototype/tests/test_analytics_engine.py
      - name: Operations Intelligence runtime — generic primitives (engine)
        run: python prototype/tests/test_ops_runtime.py
      - name: Multi-agent lease client — fencing + fail-safe
        run: python prototype/tests/test_lease_client.py
      - name: Recorder connection hardening — ports/HTTPS/discovery/trust
        run: python prototype/tests/test_recorder_probe.py
      - name: Discovery at real timeouts (Build 69 eight-network reach and the Build 74 bound)
        run: python -m pytest prototype/tests/test_discovery_field_timing.py -q
      - name: Evidence action runtime — truthful unsupported
        run: python prototype/tests/test_action_runtime.py
      - name: Archive runtime — reprocess + honest retrieval
        run: python prototype/tests/test_archive_runtime.py
      - name: Agent runtime orchestration end-to-end — engine+lease+actions+archive composed
        run: python prototype/tests/test_agent_runtime_e2e.py
      - name: Recorder hardware-probe harness — honest capability report + read-only + auth gate
        run: python prototype/tests/test_hardware_probe.py
      - name: Old-agent forward-compatibility — frozen production engine vs the 0054-0059 server
        run: python prototype/tests/test_old_agent_compat.py
      - name: Analytics sampler capacity tests
        run: python prototype/tests/test_analytics_sampler.py
      - name: Analytics Studio report rendering tests
        run: python prototype/tests/test_analytics_reporting.py
      - name: Reports preview truth contract
        run: python prototype/tests/test_reports_preview_truth.py && python prototype/tests/test_restaurant_reports_contract.py && python prototype/tests/test_tenant_reporting_governance.py
      - name: Analytics portal alignment contract
        run: python prototype/tests/test_analytics_portal_contract.py
      - name: Portal + installer alignment contract
        run: python prototype/tests/test_portal_alignment_contract.py
      - name: Intelligence agent + reporting units (native-verify, config-drift, offline-spool, PDF, WhatsApp)
        run: python -m pytest prototype/tests/test_native_verification.py prototype/tests/test_config_drift.py prototype/tests/test_spool_offline.py prototype/tests/test_intelligence_pdf.py prototype/tests/test_intelligence_whatsapp.py -q
      - name: Backfill + advisor + monthly units (backfill, AI site-config skill, monthly render)
        run: python -m pytest prototype/tests/test_backfill.py prototype/tests/test_site_config_advisor.py prototype/tests/test_intelligence_monthly.py -q
      - name: Canonical report unification + operational PDF (one dataset -> portal/WhatsApp/PDF, real PDF)
        run: python -m pytest prototype/tests/test_intelligence_report.py -q
      - name: 0.4.4 release-defect regressions (Dahua archive response-close, build-SHA stamping)
        run: python -m pytest prototype/tests/test_dahua_archive_close.py prototype/tests/test_build_metadata.py -q
      - name: Automatic outage recovery — detection, bounded/resumable/idempotent backfill, footage AI, wiring
        run: python -m pytest prototype/tests/test_recovery.py prototype/tests/test_recovery_wiring.py prototype/tests/test_recovery_ai.py prototype/tests/test_recovery_hikvision_terminal.py prototype/tests/test_recovery_rpc_contract.py prototype/tests/test_worker_exception_survival.py prototype/tests/test_recovery_legacy_checkpoint.py -q
      - name: Setup archive proof — recorder actually retains retrievable footage (verified/empty/unsupported/unknown)
        run: python -m pytest prototype/tests/test_archive_proof_setup.py -q
      - name: Post-install acceptance self-test — end-to-end site chain, hard/soft gating, no secret leak
        run: python -m pytest prototype/tests/test_acceptance_selftest.py -q
      - name: Site Status model — honest classification (unused≠failure), NA storage, status-json wiring
        run: python -m pytest prototype/tests/test_site_status.py -q
      - name: Site Status controller — panel action bindings drive the agent CLI (accept/update/rollback/bundle)
        run: python -m pytest prototype/tests/test_status_controller.py -q
      - name: Retention depth — bounded archive-boundary probe (measured/at_least/empty/unsupported)
        run: python -m pytest prototype/tests/test_retention.py -q
      - name: Camera Monitor/Ignore merge — setup config folds into the sync payload
        run: python -m pytest prototype/tests/test_camera_config.py -q
      - name: Support bundle — non-secret diagnostic export (allowlist redaction, no secret leak)
        run: python -m pytest prototype/tests/test_support_bundle.py -q
      - name: In-app update engine — signed manifest (Ed25519), channels, version + SHA-256 integrity gating
        run: python -m pytest prototype/tests/test_updater.py -q
      - name: 5.1.1 update lifecycle — Agent-only vs Repair-package contract, remote-update commit gate, installer/uninstall contracts (PowerShell parts run in setup-ui-build)
        run: python -m pytest prototype/tests/test_update_contract.py prototype/tests/test_remote_update_commit_gate.py prototype/tests/test_installer_lifecycle_contract.py prototype/tests/test_remote_maintenance_hikvision.py -q
      - name: Report pipeline contract (n8n -> runner -> idempotent delivery)
        run: python prototype/tests/test_report_pipeline_contract.py
      - name: Site Control portal capability-aware UX contract
        run: python prototype/tests/test_site_control_portal_contract.py
      - name: Site Control catalog parity — database accepts only actions the Agent runs (MNVR-069)
        run: python -m pytest prototype/tests/test_site_control_catalog_parity.py -q
      - name: Remote acceptance test + remote maintenance (5.1.2 D) — per-check PASS/FAIL/UNKNOWN/UNSUPPORTED on Hikvision- and Dahua-like fakes, multi-recorder sections, time budget, bounded result, redacted diagnostics, reconnect/restart, 0163 static contract
        run: python -m pytest prototype/tests/test_full_acceptance.py prototype/tests/test_site_maintenance.py prototype/tests/test_site_acceptance_migration.py -q
      - name: Branded Windows installer product contract
        run: python prototype/tests/test_windows_installer_product.py
      - name: Platform admin contract gate
        run: python prototype/tests/test_platform_admin_contract.py
      - name: Recorder-push parser tests
        run: python prototype/tests/test_push_bridge.py
      - name: Capability-probe tests
        run: python prototype/tests/test_capabilities.py
      - name: Vendor capability matrix contract (honest — no fabricated capability)
        run: python prototype/tests/test_vendor_capability_matrix.py
      - name: AI device-knowledge registry — normalized, source-linked, evidence-graded; FIELD_VERIFIED guarded
        run: python prototype/tests/test_device_knowledge_validator.py
      - name: Email template tests
        run: python prototype/tests/test_email_template.py
      - name: ONNX inference test (skips if model absent)
        run: python prototype/tests/test_vision_onnx.py
