name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test deps
        run: python -m pip install --quiet pillow requests numpy onnxruntime
      - name: Compile all Python
        run: python -m compileall -q prototype tools
      - name: Secret scan (tracked tree)
        run: python tools/secret_scan.py
      - name: Migration lint
        run: python tools/lint_migrations.py
      - name: Vision false-alarm filter tests
        run: python prototype/tests/test_vision_filter.py
      - name: Recorder-push parser tests
        run: python prototype/tests/test_push_bridge.py
      - name: Capability-probe tests
        run: python prototype/tests/test_capabilities.py
      - name: Email template tests
        run: python prototype/tests/test_email_template.py
      - name: ONNX inference test (skips if model absent)
        run: python prototype/tests/test_vision_onnx.py
      - name: Pricing alignment (website == billing)
        run: python prototype/tests/test_pricing_alignment.py
      - name: No em dashes in public-site copy
        run: python tools/check_no_emdash.py
    # NOTE: test_tenant_isolation, test_billing_authz and test_team_and_trial
    # need live Supabase + secrets and (for two of them) write to the DB.
    # They are deliberately NOT run here — CI must not touch production.

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci
      - name: Production build (static export)
        run: npm run build
        env:
          # Public-by-design placeholders so the static export builds in CI.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
