  # PRODUCTION-ORDER simulation: production is already at 0001-0039 + 0042-0048 WITHOUT 0040/0041, so the
  # real upgrade applies 0040/0041 out of numeric order on top of 0048. The `integration` job above applies
  # 0001..0048 in numeric order (a clean install) and does NOT exercise that path. This job reproduces the
  # exact production order and proves the incident lifecycle works AND Phase-A health is undisturbed.
  integration-prod-order:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SUPABASE_DB_HOST: localhost
      SUPABASE_DB_PORT: "5432"
      SUPABASE_DB_USER: postgres
      SUPABASE_DB_PASSWORD: postgres
      SUPABASE_DB_NAME: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install psycopg + psql client
        run: |
          python -m pip install --quiet "psycopg[binary]"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Supabase-shim prelude (roles, auth schema, auth.uid) on the disposable Postgres
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f prototype/supabase/ci_prelude.sql
      - name: Production-order simulation (0042-0048 baseline -> 0040/0041 -> incident lifecycle -> health smoke)
        run: bash prototype/tests/prod_order_integration.sh

  edge-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Router policy unit tests (fail-closed config, egress gate, NO_MODEL, candidate ordering)
        working-directory: prototype/supabase/functions/watchlog-ai
        run: deno test providers/router_test.ts
      - name: Recorder card grounding and per-recorder Site Control target tests
        working-directory: prototype/supabase/functions/watchlog-ai
        run: deno test recorder_card_test.ts site_control_target_test.ts
      - name: Type-check the WatchLog AI edge function (provider router + secure config)
        working-directory: prototype/supabase/functions/watchlog-ai
        run: deno check index.ts
