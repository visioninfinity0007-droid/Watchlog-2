name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test deps
        run: python -m pip install --quiet pillow requests numpy onnxruntime tzdata
      - name: Compile all Python
        run: python -m compileall -q prototype tools
      - name: WordPress PHP syntax
        run: |
          php -l deploy/wordpress/themes/watchlog/front-page.php
          php -l deploy/wordpress/themes/watchlog/page-platform.php
          php -l deploy/wordpress/themes/watchlog/page-security.php
          php -l deploy/wordpress/themes/watchlog/page-solutions.php
      - name: Secret scan (tracked tree)
        run: python tools/secret_scan.py
      - name: Migration lint
        run: python tools/lint_migrations.py
      - name: SaaS operations security contract
        run: python prototype/tests/test_saas_operations_contract.py
      - name: Customer lifecycle contract
        run: python prototype/tests/test_customer_lifecycle_contract.py
      - name: Customer portal language contract
        run: python prototype/tests/test_customer_portal_language.py
      - name: Control Room security/product contract
        run: python prototype/tests/test_control_room_contract.py
      - name: Control Room reporting contract
        run: python prototype/tests/test_control_room_reporting_contract.py
      - name: Production preflight read-only contract
        run: python prototype/tests/test_watchlog_production_preflight.py
      - name: Deployment smoke read-only contract
        run: python prototype/tests/test_watchlog_deployment_smoke.py
      - name: Auth redirect + recovery contract
        run: python prototype/tests/test_auth_flow_contract.py
      - name: Vision false-alarm filter tests
        run: python prototype/tests/test_vision_filter.py
      - name: Analytics Studio local rule-engine tests
        run: python prototype/tests/test_analytics_engine.py
      - name: Analytics sampler capacity tests
        run: python prototype/tests/test_analytics_sampler.py
      - name: Analytics Studio report rendering tests
        run: python prototype/tests/test_analytics_reporting.py
      - name: Reports preview truth contract
        run: python prototype/tests/test_reports_preview_truth.py
      - name: Analytics portal alignment contract
        run: python prototype/tests/test_analytics_portal_contract.py
      - name: Portal + installer alignment contract
        run: python prototype/tests/test_portal_alignment_contract.py
      - name: Branded Windows installer product contract
        run: python prototype/tests/test_windows_installer_product.py
      - name: Platform admin contract gate
        run: python prototype/tests/test_platform_admin_contract.py
      - name: Recorder-push parser tests
        run: python prototype/tests/test_push_bridge.py
      - name: Capability-probe tests
        run: python prototype/tests/test_capabilities.py
      - name: Email template tests
        run: python prototype/tests/test_email_template.py
      - name: ONNX inference test (skips if model absent)
        run: python prototype/tests/test_vision_onnx.py
      - name: Pricing alignment (website == billing)
        run: python prototype/tests/test_pricing_alignment.py
      - name: Public website claims + maturity contract
        run: python prototype/tests/test_public_claims_contract.py
      - name: No em dashes in public-site copy
        run: python tools/check_no_emdash.py
    # Live tenant isolation, billing authz, team/trial, analytics API and
    # platform-admin denial checks need a disposable Supabase target. CI must
    # never mutate production.

  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Production build (static export)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  setup-ui-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build branded windowed setup executable
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          powershell -ExecutionPolicy Bypass -File prototype\agent\build_setup_gui.ps1
          $exe = Get-Item prototype\dist\watchlog-setup-ui.exe
          if ($exe.Length -lt 5MB) { throw "setup UI is too small: $($exe.Length)" }
      - name: Exercise DPAPI round trip and migration mode
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONPATH = (Resolve-Path prototype\agent).Path
          # DPAPI crypto round trip — the 0.3.4 store is a BYTES API (the old str
          # signature raised TypeError). Pure protect/unprotect, no DACL/elevation.
          python -c "from windows_secret import protect_bytes, unprotect_bytes; b=b'recorder-test-secret'; assert unprotect_bytes(protect_bytes(b)) == b; print('DPAPI round trip OK')"
          if ($LASTEXITCODE -ne 0) { throw "DPAPI round trip failed: $LASTEXITCODE" }
          # Real migration: seed a legacy watchlog.env in an isolated ProgramData and
          # prove the frozen setup UI migrates it into the encrypted split store
          # (a blank config would be a no-op that proves nothing about the store).
          $pd = Join-Path $env:RUNNER_TEMP "wl-ci-migrate"
          if (Test-Path $pd) { Remove-Item $pd -Recurse -Force }
          $wl = Join-Path $pd "WatchLog"; New-Item -ItemType Directory -Force $wl | Out-Null
          Set-Content -Path (Join-Path $wl "watchlog.env") -Encoding ASCII -Value "WATCHLOG_NVR_PASSWORD=ci-legacy-pw"
          $cfg = Join-Path $wl "watchlog.ini"
          Set-Content -Path $cfg -Encoding UTF8 -Value @('[watchlog]', 'nvr_username = ci_op', 'supabase_url = https://example.supabase.co', 'supabase_publishable_key = ci-placeholder', 'nvr_driver = auto')
          $origPd = $env:PROGRAMDATA
          try {
            $env:PROGRAMDATA = $pd
            # setup UI is a --windowed app; PowerShell's & does NOT wait for GUI-
            # subsystem exes, so the blob check would race the migration. Start-Process
            # -Wait blocks until --migrate-only actually finishes.
            $mp = Start-Process -FilePath (Resolve-Path prototype\dist\watchlog-setup-ui.exe).Path -ArgumentList @('--migrate-only','--config',$cfg) -Wait -PassThru
            if ($mp.ExitCode -ne 0) { throw "setup UI migration mode failed: $($mp.ExitCode)" }
          } finally { $env:PROGRAMDATA = $origPd }
          if (-not (Test-Path (Join-Path $wl "Secrets\nvr_credential.dpapi"))) { throw "migration did not create the encrypted credential" }
          if (Test-Path (Join-Path $wl "watchlog.env")) { throw "legacy watchlog.env not removed after migration" }
          Remove-Item $pd -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "DPAPI round trip + real legacy migration verified."

  installer-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NSIS
        shell: powershell
        run: choco install nsis -y --no-progress
      - name: Compile NSIS release manifest with explicit stub payloads
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:RUNNER_TEMP "watchlog-nsis-contract"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item prototype\installer\nsis\watchlog.nsi (Join-Path $stage "watchlog.nsi")
          Copy-Item prototype\installer\run-agent.ps1 (Join-Path $stage "run-agent.ps1")
          Copy-Item prototype\installer\register-service.ps1 (Join-Path $stage "register-service.ps1")
          Copy-Item "prototype\installer\READ ME FIRST.txt" (Join-Path $stage "READ ME FIRST.txt")
          Copy-Item prototype\installer\setup.ico (Join-Path $stage "setup.ico")
          # Syntax contract only: the real release workflow separately builds
          # and size-checks both executables before publishing an artifact.
          [IO.File]::WriteAllBytes((Join-Path $stage "watchlog-agent.exe"), [byte[]](0))
          [IO.File]::WriteAllBytes((Join-Path $stage "watchlog-setup-ui.exe"), [byte[]](0))
          @"
          [watchlog]
          supabase_url = https://example.supabase.co
          supabase_publishable_key = ci-placeholder
          enrollment_code =
          nvr_driver = auto
          "@ | Set-Content (Join-Path $stage "watchlog.defaults.ini") -Encoding UTF8
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { $makensis = (Get-Command makensis).Source }
          Push-Location $stage
          & $makensis "/DICON=setup.ico" "watchlog.nsi"
          $rc = $LASTEXITCODE
          Pop-Location
          if ($rc -ne 0) { throw "makensis failed with exit $rc" }
          if (-not (Test-Path (Join-Path $stage "WatchLog-Setup.exe"))) { throw "NSIS output missing" }
