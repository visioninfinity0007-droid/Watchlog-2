version: 1
id: restaurant
status: IMPLEMENTED
kind: site_type
purpose: >
  Reusable semantic and reporting policy for restaurants and cafes where WatchLog
  uses camera evidence for business-operations intelligence in addition to security.

authority:
  factual_state: watchlog_database
  semantic_policy: ai_harness
  rule: >
    The harness defines what a metric means and when it is allowed. The database
    supplies the actual site, camera, calibration, coverage, event and observation facts.

service_day:
  supports_overnight: true
  naming_rule: >
    An overnight service day is named by the calendar date on which the configured
    opening time occurs. After midnight, activity remains in that service day until
    the configured close/pre-open boundary says otherwise.

camera_roles:
  dining_floor:
    purpose: customer seating and table-service analytics
    allowed_outputs:
      - visible_diners
      - occupied_tables
      - table_utilization_pct
      - estimated_table_sessions
      - estimated_covers
      - average_party_size
      - party_size_mix
      - largest_visible_party
      - session_starts_by_period
      - table_turnover
      - served_table_sessions
      - served_session_rate
      - observed_time_to_first_service_minutes
      - observed_time_to_food_minutes
      - minimum_observed_dwell_minutes
      - visible_table_service_actions
      - staff_presence
    forbidden_outputs:
      - unique_footfall_without_entry_line
      - sales
      - revenue
      - order_accuracy
      - food_quality
      - customer_identity
      - customer_demographics
  service_handoff:
    purpose: waiter/pickup/service handoff pressure
    allowed_outputs:
      - handoff_load
      - staff_waiting
      - ready_item_dwell
      - service_congestion
    forbidden_outputs:
      - customer_footfall
      - exact_order_backlog
      - sales
  cash_counter:
    purpose: till/workstation activity
    allowed_outputs:
      - counter_active
      - staff_presence
      - unattended_periods
      - visible_counter_interactions
    forbidden_outputs:
      - customer_queue_length_unless_geometry_supports_it
      - transaction_count
      - sales
      - revenue
  kitchen:
    purpose: back-of-house operational pressure
    allowed_outputs:
      - kitchen_load
      - staff_presence
      - station_activity
      - congestion
      - visible_output
      - cleaning_reset
    forbidden_outputs:
      - food_quality
      - order_accuracy
      - health_diagnosis
      - staff_productivity
      - confirmed_fire_without_incident_evidence
  service_access:
    purpose: staff/service/delivery access
    allowed_outputs:
      - service_access
      - delivery_activity
      - vehicle_dwell
      - after_hours_movement
    forbidden_outputs:
      - customer_footfall
  office_security:
    purpose: security and management context
    allowed_outputs:
      - presence
      - unusual_access
      - after_hours_presence
    forbidden_outputs:
      - customer_volume
      - restaurant_service_performance
  # Portal camera-purpose values. The roles above remain valid tenant role keys and keep their
  # semantics; dining = dining_floor, cashier = cash_counter, service_area = service_handoff.
  dining:
    purpose: customer seating and table-service analytics (same semantics as dining_floor)
    alias_of: dining_floor
    forbidden_outputs: [unique_footfall_without_entry_line, sales, revenue, customer_identity, customer_demographics]
  outdoor_seating:
    purpose: outdoor seating activity
    allowed_outputs: [visible_diners, busy_periods, after_hours_activity]
    forbidden_outputs: [unique_footfall_without_entry_line, sales, revenue, estimated_covers_without_calibrated_tables]
  cashier:
    purpose: till/workstation activity (same semantics as cash_counter)
    alias_of: cash_counter
    forbidden_outputs: [transaction_count, sales, revenue, customer_queue_length_unless_geometry_supports_it]
  service_area:
    purpose: service handoff and pickup activity (same semantics as service_handoff)
    alias_of: service_handoff
    forbidden_outputs: [customer_footfall, exact_order_backlog, sales]
  entrance:
    purpose: customer and staff entrance activity
    allowed_outputs: [person_activity, first_last_activity, after_hours_activity]
    forbidden_outputs: [footfall_without_validated_counting_line, unique_customers, sales]
  restricted:
    purpose: sensitive/restricted-area access
    allowed_outputs: [presence, access_activity, after_hours_presence]
    forbidden_outputs: [wrongdoing, identity]
  parking:
    purpose: vehicle and parking-area activity
    allowed_outputs: [vehicle_activity, vehicle_dwell, after_hours_parking]
    forbidden_outputs: [customer_count, vehicle_identity_without_validated_plate_reading]
  perimeter:
    purpose: external boundary movement
    allowed_outputs: [person_activity, vehicle_activity, after_hours_activity]
    forbidden_outputs: [intrusion_without_incident_evidence]
  general:
    purpose: general site activity
    allowed_outputs: [person_activity, busy_periods, quiet_periods]
    forbidden_outputs: [unique_customers, footfall]

metrics:
  visible_diners:
    evidence_class: observed
    definition: concurrent customers visibly present on dining-floor cameras at a sample time
    never_call:
      - footfall
      - unique_customers
  occupied_tables:
    evidence_class: observed
    definition: calibrated table anchors visibly occupied at a sample time
  table_utilization_pct:
    evidence_class: estimated
    definition: occupied valid observations divided by valid observations for a calibrated table
    caveat: coverage gaps, movable furniture and occlusion reduce representativeness
  estimated_table_sessions:
    evidence_class: estimated
    definition: >
      a session starts when a calibrated table changes from empty/unknown to occupied,
      or occupancy resumes after a configured observation gap
  estimated_covers:
    evidence_class: estimated
    definition: >
      peak visible party size counted once per defensible de-duplicated physical table/party session
      within the represented service period
    caveat: >
      do not present as a full-service-day total when material trading periods are unverified;
      overlapping dining views and joined tables must be reconciled before aggregation
    never_call:
      - unique_customer_count
      - POS_covers
      - exact_daily_footfall
  average_party_size:
    evidence_class: estimated
    definition: estimated covers divided by defensible estimated table sessions after overlap/joined-table reconciliation
    caveat: always state the qualifying session count
  party_size_mix:
    evidence_class: estimated
    definition: >
      share of defensible dining parties grouped into neutral visible party-size buckets:
      1 person, 2 people, 3-4 people, and 5+ people
    caveat: never infer relationship, gender, age or demographics from party composition
  largest_visible_party:
    evidence_class: estimated
    definition: largest defensible visible party size across de-duplicated table sessions, including joined-table parties
  session_starts_by_period:
    evidence_class: estimated
    definition: count of defensible new table-session starts by business time period
    never_call:
      - customer_arrivals
      - entrance_footfall
  table_turnover:
    evidence_class: estimated
    definition: defensible table-session starts per calibrated physical table or zone during represented time
    caveat: requires reliable table identity and session continuity; movable/joined tables must be reconciled
  visible_table_service_actions:
    evidence_class: observed
    definition: >
      people visibly performing defensible table-service actions such as approaching, serving,
      clearing or interacting with an occupied table
    never_call:
      - staff_headcount
      - waiter_attendance
      - employee_identity
      - staff_productivity
  observed_time_to_first_service_minutes:
    evidence_class: observed_derived
    definition: first visibly occupied/seated evidence to first defensible visible table-service interaction
    caveat: a service interaction does not prove order placement
    never_call:
      - order_wait_time
      - POS_order_time
      - waiter_response_SLA
  served_table_sessions:
    evidence_class: observed_derived
    definition: estimated table sessions where food becomes visibly present at least once
    never_call:
      - completed_orders
      - correct_orders
      - paid_orders
  served_session_rate:
    evidence_class: observed_derived
    definition: defensible served table sessions divided by defensible occupied table sessions
    caveat: always state the qualifying session count and represented evidence window
    never_call:
      - order_completion_rate
      - kitchen_success_rate
      - paid_order_rate
  observed_time_to_food_minutes:
    evidence_class: observed_derived
    definition: first visibly occupied/seated evidence to first frame where food is visibly present
    never_call:
      - POS_order_to_serve
      - kitchen_ticket_time
  minimum_observed_dwell_minutes:
    evidence_class: observed_derived
    definition: first occupied observation to last observed occupied frame
    caveat: lower bound only
  timing_resolution_rule:
    applies_to: [estimated_table_sessions, observed_time_to_first_service_minutes, observed_time_to_food_minutes, minimum_observed_dwell_minutes]
    rule: >
      Timing metrics can be no more precise than the ACTUAL capture interval of the camera, which is a
      runtime fact and may differ from the configured target. State the interval. Above 120 s, present
      time-to-food and dwell as coarse ranges, never as precise minutes, and do not derive a session
      from one frame.
  kitchen_load:
    evidence_class: estimated
    range: 0_to_1
    definition: relative visible operational pressure
    never_call:
      - orders_per_hour
      - production_quantity
      - staff_productivity
  handoff_load:
    evidence_class: estimated
    range: 0_to_1
    definition: relative visible service-handoff pressure
    never_call:
      - exact_order_backlog
      - customer_queue_length_without_geometry
  customer_footfall:
    evidence_class: geometry_dependent
    rule: >
      Footfall is unavailable unless a configured camera provides a clean, validated
      customer-entry counting line. Visible diners or estimated covers must never be relabelled as footfall.

movable_tables:
  enabled: true
  identity_model: calibrated_anchor_or_zone
  combining_rule: >
    Preserve underlying table keys. When adjacent movable tables are visibly joined
    for one party, assign the same combined_group to those table rows for session reasoning.
  movement_rule: >
    Normal movement inside a calibrated zone is allowed. When a table moves too far
    from its expected zone, lower table-tracking confidence and recommend recalibration
    rather than inventing identity.

analytics_quality:
  principle: measurement_quality_precedes_business_advice
  scores:
    visibility_quality: {range: 0_to_1, direction: higher_is_better}
    people_count_confidence: {range: 0_to_1, direction: higher_is_better, roles: [dining_floor]}
    table_tracking_confidence: {range: 0_to_1, direction: higher_is_better, roles: [dining_floor]}
    glare_level: {range: 0_to_1, direction: higher_is_worse}
    overexposure_level: {range: 0_to_1, direction: higher_is_worse}
    occlusion_level: {range: 0_to_1, direction: higher_is_worse}
    obstruction_level: {range: 0_to_1, direction: higher_is_worse}
    camera_angle_adequacy: {range: 0_to_1, direction: higher_is_better}
    lighting_uniformity: {range: 0_to_1, direction: higher_is_better}
  accuracy_rule: >
    Model confidence is not measured accuracy. Never publish a customer-count accuracy
    percentage until representative frames have been manually counted and compared with WatchLog.
  recommendation_rule: >
    Camera/lighting/recalibration recommendations require repeated evidence across frames.
    A single poor frame is not a trend.

report_windows:
  today:
    purpose: current service-day operations
  yesterday:
    purpose: completed prior service-day operations plus saved security/evidence report when available
  last_7_days:
    purpose: short-term pattern and previous-period comparison
  last_30_days:
    purpose: management trend, weekday/weekly pattern and improvement review

truth_boundaries:
  - missing observation time is missing coverage, not zero activity
  - a single image is an observation, not a trend
  - site-wide dining totals require a complete composite across configured dining-floor cameras
  - overlapping dining views must be reconciled to physical parties/tables before site-wide sessions or covers are aggregated
  - full-day estimated covers require adequate representation of the trading service day; otherwise label covers as represented-period estimates
  - every session-derived average, median, rate or distribution states its qualifying sample size
  - visible table-service actions do not establish staff identity, attendance, headcount or productivity
  - never infer gender, age, ethnicity or other customer demographics from appearance
  - recommendations about staffing, service or layout require repeated observations and adequate coverage


client_reporting:
  audience: business_owner_or_manager
  principle: business_value_first
  lead_with:
    - demand_and_table_use
    - estimated_covers_and_party_mix
    - service_responsiveness
    - service_flow
    - kitchen_handoff_counter_operations
    - security_and_access
    - closing_discipline
    - customer_facing_presentation
    - practical_actions
  never_expose_in_client_report:
    - snapshot_counts
    - processing_queue_status
    - worker_names
    - model_or_provider_names
    - database_table_names
    - rpc_or_function_names
    - processing_attempts
    - external_egress_policy
    - internal_ids
    - implementation_failures
  incomplete_evidence_rule: >-
    Describe the represented business observation window in plain management language.
    Do not turn a technical collection/processing limitation into the headline of the
    client report.
  manual_review_rule: >-
    A completed human/manual visual review can be the authoritative daily owner brief
    when automated structured extraction is unavailable. A client must not see an
    internal processing state above a completed reviewed report.

# Owner-intelligence profile (added alongside, never replacing, the semantics above).
metric_status:
  visible_diners: {evidence: restaurant camera review of dining-floor cameras, status: implemented}
  occupied_tables: {evidence: calibrated table anchors (calibrated sites only), status: implemented}
  table_utilization_pct: {evidence: calibrated table anchors over valid observations, status: implemented}
  estimated_table_sessions: {evidence: calibrated table occupancy changes, status: implemented}
  estimated_covers: {evidence: de-duplicated peak visible party size per estimated table session, status: implemented}
  average_party_size: {evidence: estimated covers divided by qualifying table sessions, status: derivable}
  party_size_mix: {evidence: qualifying table sessions grouped by neutral visible party-size buckets, status: derivable}
  largest_visible_party: {evidence: maximum qualifying party size including joined-table parties, status: derivable}
  session_starts_by_period: {evidence: qualifying estimated table-session starts grouped by business period, status: derivable}
  table_turnover: {evidence: qualifying session starts per calibrated physical table/zone, status: derivable}
  visible_table_service_actions: {evidence: defensible table-service actions in dining views, status: implemented}
  observed_time_to_first_service_minutes: {evidence: seated-to-first visible table-service interaction; bounded by actual observation interval, status: derivable}
  served_table_sessions: {evidence: food visibly present in an estimated table session, status: implemented}
  served_session_rate: {evidence: served qualifying sessions divided by qualifying occupied sessions, status: derivable}
  observed_time_to_food_minutes: {evidence: seated-to-food visible evidence; bounded by the actual observation interval, status: implemented}
  minimum_observed_dwell_minutes: {evidence: first-to-last occupied observation, status: implemented}
  kitchen_load: {evidence: restaurant camera review of kitchen cameras, status: implemented}
  handoff_load: {evidence: restaurant camera review of service-handoff cameras, status: implemented}
  opening_closing_activity: {evidence: configured service-day opening/closing + first/last activity per camera, status: implemented}
  after_hours_activity: {evidence: configured after-hours window + daily intelligence, status: implemented}
  peak_activity_hour: {evidence: daily intelligence peak hour, status: implemented}
  attention_items: {evidence: incidents/attention, status: implemented}
  monitoring_coverage: {evidence: live/recovered/unverified seconds, status: implemented}
  activity_rule_counts: {evidence: line crossing / zone presence counts per rule, status: implemented}
  period_comparison: {evidence: daily intelligence + restaurant reports across completed service days, status: derivable}
  customer_footfall: {evidence: needs a validated customer-entry counting line, status: field_gated}
  counter_queue_length: {evidence: needs validated counter geometry, status: field_gated}
  staff_vs_customer_split: {evidence: no validated staff/customer separation beyond role context, status: field_gated}
  sales_revenue_or_pos_timing: {evidence: requires POS data, status: external_data_required}
  attendance: {evidence: requires HR/rota records, status: external_data_required}

owner_questions:
  - Did anything need my attention yesterday?
  - Were all cameras watching the whole service day?
  - What time did we open and close, going by activity?
  - How busy was the dining floor, and when was the peak?
  - Roughly how many dining covers were represented, and across how many table sessions?
  - What was the typical party size, and how much demand came from 1, 2, 3-4 and 5+ person groups?
  - When did new table sessions start most heavily?
  - How well were the tables used and how quickly did they turn over?
  - How long did tables wait for a first visible service interaction and for served items?
  - How busy were the kitchen and the service handoff?
  - Was the cash counter ever left unattended?
  - Was there any activity after closing?
  - How does yesterday compare with the same day last week?
  - What should I change, based on repeated evidence?

home_modules:
  - {id: attention, label: What needs attention}
  - {id: coverage, label: Monitoring coverage}
  - {id: demand_and_table_use, label: Demand and table use}
  - {id: service_flow, label: Service flow}
  - {id: kitchen_counter, label: Kitchen, handoff and counter}
  - {id: closing_discipline, label: Opening, closing and after hours}

insight_modules:
  - {id: peak_hour, label: Busiest hour}
  - {id: covers_and_party_mix, label: Covers and party mix}
  - {id: session_starts, label: New table sessions}
  - {id: first_service, label: Time to first service}
  - {id: time_to_food, label: Time to food}
  - {id: unattended_counter, label: Counter attention}
  - {id: after_hours, label: After-hours activity}
  - {id: period_trend, label: Compared with recent days}

report_sections:
  - what needs attention
  - monitoring coverage and evidence gaps
  - demand, estimated covers and party mix
  - table sessions, utilization and turnover
  - service responsiveness
  - service flow
  - kitchen, handoff and counter operations
  - security and access
  - opening, closing and after-hours activity
  - practical, evidence-based actions

comparison_metrics:
  estimated_covers_vs_same_weekday: {compares: estimated covers, basis: same weekday last week, status: derivable}
  average_party_size_vs_recent_days: {compares: average party size, basis: comparable represented service days, status: derivable}
  party_size_mix_vs_recent_days: {compares: neutral party-size distribution, basis: comparable represented service days, status: derivable}
  table_session_starts_vs_recent_days: {compares: new table-session starts by period, basis: comparable represented service days, status: derivable}
  table_utilization_vs_recent_days: {compares: table utilization, basis: 7 completed service days, status: derivable}
  time_to_food_vs_recent_days: {compares: observed time to food, basis: 7-day median, status: derivable}
  after_hours_activity_vs_recent_days: {compares: after-hours activity, basis: 7/30 service days, status: derivable}
  coverage_vs_recent_days: {compares: verified coverage, basis: 7/30 days, status: derivable}

recommended_questions:
  - How busy were we last night, and when was the peak?
  - How well were the tables used yesterday?
  - How long did tables wait for food this week?
  - Was there any activity after closing?
  - Were any cameras not covering the restaurant yesterday?

prohibited_interpretations:
  - visible diners or estimated covers as footfall or unique customers
  - appearance-derived gender, age, ethnicity, relationship status or other customer demographics
  - estimated covers as POS covers, orders or sales
  - time to first visible service interaction as proven order-taking time, staff SLA or waiter performance
  - visible table-service actions as staff identity, attendance, headcount or productivity
  - time to food as kitchen ticket time or POS order-to-serve
  - kitchen or handoff load as orders per hour or staff productivity
  - counter activity as transactions, sales or revenue
  - food quality, order accuracy or health claims
  - identity or demographics of customers or staff

unknown_behaviour:
  rule: >
    Missing observation time is missing coverage, not zero activity. Say what cannot be confirmed.
  missing_external_data: >
    For sales, revenue or POS timings, say WatchLog does not hold that data and offer the observed
    table and service evidence instead, labelled as estimated or observed.

coverage_requirements:
  quiet_or_inactive_claims: verified LIVE or RECOVERED coverage for the whole window on the named camera
  site_wide_dining_totals: a complete composite across configured dining-floor cameras with overlapping physical parties/tables reconciled
  full_day_estimated_covers: no material unverified trading period; otherwise label the result as estimated covers in the represented period
  session_metrics: reliable calibrated physical-table identity plus defensible session continuity
  timing_metrics: actual observation interval stated; coarse ranges above 120 s and qualifying session count always shown
  party_mix: defensible de-duplicated sessions only; use neutral party-size buckets and no demographic inference
  comparisons: both periods need comparable verified coverage; otherwise flag the comparison as partial
