# WatchLog customer vocabulary: the single source for what may never appear in anything a customer
# sees. That covers chat answers, reports (every field except internal audit keys), WhatsApp/email
# summaries, owner summaries, portal copy and website copy.
#
# Enforced in code, not only by instruction:
#   - watchlog-ai chat: compiled into the harness brief AND applied to every answer
#     (prototype/scripts/compile_harness_brief.py -> harness_brief.generated.ts)
#   - report + visual-summary saves: DB safety-net trigger (migration 0141) rewrites any match,
#     using the same rules seeded from this file
#   - vision workers: compiled rules in their prompts; owner summaries written without these terms
#
# Patterns are case-insensitive regular expressions with \b word boundaries. The DB guard translates
# \b to Postgres \y. Keep every pattern specific: business words such as "customer queue",
# "sales pipeline", "recorder model" or "cloud providers" are legitimate and must stay allowed.
version: 1
status: IMPLEMENTED
kind: customer_vocabulary

principles:
  - Describe WHAT was seen and WHEN, never HOW WatchLog captured, stored, sampled, processed or reviewed it.
  - Coverage is a time window and a completeness statement ("the cameras covered 4:39 PM to 3:35 AM"), never a count of images.
  - Never name the technology, vendors, models, AI providers, infrastructure or internal processes behind a result.
  - Never state how many images were captured, reviewed or analysed, or how often cameras are sampled.

internal_keys_exempt: [review_audit, internal, internal_notes, internal_audit, audit, _internal, trace, debug, provenance]

forbidden:
  # Order matters: the safety-net rewrite applies these top to bottom. Multi-word phrases come before
  # the single words they contain. replace_with is a safe, plain substitute for automatic rewriting;
  # authors should write good customer language in the first place (see say_instead).
  - id: review_process
    pattern: '\b(manually reviewed|manual review|visual review|image[- ]by[- ]image|exported review file|review file)\b'
    replace_with: reviewed
    say_instead: "reviewed / WatchLog reviewed the camera coverage"
  - id: analysed_images
    pattern: '\banaly[sz]ed (images?|snapshots?|frames?)\b'
    replace_with: reviewed camera coverage
    say_instead: "reviewed camera coverage"
  - id: camera_internals
    pattern: '\bcanonical cameras?\b|\b(transport|stream|onvif) profiles?\b|\blegacy (camera )?rows?\b'
    replace_with: cameras
    say_instead: cameras
  - id: sampling
    pattern: '\b(no )?sampling\b|\bsampled\b|\bcapture (interval|cadence)\b'
    replace_with: ""
    say_instead: "(omit) - describe coverage as a time window"
  - id: image_units
    pattern: '\b(snapshots?|still images?|video frames?|frames?)\b'
    replace_with: camera coverage
    say_instead: "what the cameras showed / camera coverage / a camera view (or just describe the scene)"
  - id: processing
    pattern: '\b(processing|job|review|task) queue\b|\bpipeline (state|failure|status|stage)\b|\bprocessing (state|status|attempts?)\b|\bbacklog\b'
    replace_with: ""
    say_instead: "(omit)"
  - id: ai_internals
    pattern: '\b(ai|language|vision|llm|detection) models?\b|\bmodel (name|provider|routing)\b|\b(ai|model|llm|inference) providers?\b|\bdetector( class(es)?)?\b|\bconfidence (score|tier)s?\b|\bprompt\b'
    replace_with: WatchLog
    say_instead: "(omit) - state what WatchLog observed and how certain it is in plain words"
  - id: vendors_and_tools
    pattern: '\b(groq|ollama|cloudflare workers ai|qwen\w*|gemma\w*|gpt-oss|llama\w*|rf-detr|yolo\w*|mediapipe|compreface|onnx\w*|supabase|coolify|seaweedfs|minio|n8n)\b'
    replace_with: WatchLog
    say_instead: "(omit)"
  - id: infrastructure
    pattern: '\b(egress|rpc|edge function|vision worker|private worker|worker (id|state|status)|database (table|field|schema)s?|schema cache|service role)\b'
    replace_with: WatchLog
    say_instead: "(omit)"
