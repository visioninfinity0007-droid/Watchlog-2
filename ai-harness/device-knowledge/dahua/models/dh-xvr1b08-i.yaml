- capability: time_ntp_config
  support:
    verdict: supported
    evidence_class: FIELD_VERIFIED
  ai_location: recorder
  read:
    supported: true
    method: CGI global.cgi?action=getCurrentTime + configManager.cgi name=Locales,NTP
  write:
    supported: true
    method: CGI global.cgi?action=setCurrentTime + configManager.cgi name=Locales,NTP
    safety_class: safe_write
  verification:
    required: false
  notes: Locales/NTP/global setCurrentTime; DST off + NTP on + GMT+5 applied in field.
- capability: snapshot
  support:
    verdict: supported
    evidence_class: FIELD_VERIFIED
  ai_location: recorder
  read:
    supported: true
    method: CGI snapshot.cgi?channel=N (low snapshot-encode res, often CIF 352x288; full res via main-stream
      RTSP keyframe subtype=0)
  write:
    supported: false
    method: na
    safety_class: read
  verification:
    required: false
  notes: snapshot.cgi returns the recorder low snapshot-encode res (often CIF 352x288); a video-loss channel
    returns a black placeholder. Do NOT use snapshot alone for liveness. Full resolution requires a main-stream
    RTSP keyframe (subtype=0).
