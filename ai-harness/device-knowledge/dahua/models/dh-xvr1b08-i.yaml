# WatchLog device-knowledge registry - GENERATED, evidence-graded, honest-unknown.
# Source of truth: the DB capability KB (migrations 0061/0066/0077) + docs/research/*.
# Do not hand-edit; do not upgrade an evidence_class without a dated source.
# Evidence: FIELD_VERIFIED > OFFICIAL_DOCUMENTED > IMPLEMENTED_UNVERIFIED > UNSUPPORTED > UNKNOWN.
# Verdict: supported | unsupported | by_camera | unknown.  Safety: read | safe_write | high_risk | prohibited | na.
manufacturer: Dahua
family: Cooper-I (XVR1B)
model: DH-XVR1B08-I
firmware_range: HW v2.0; datasheet Rev 002.000 (2024); live unit firmware not yet captured (next probe)
recorder_type: XVR (penta-brid DVR)
ai_processing_location: recorder
hardware:
  max_analog_ch: 8
  max_ip_ch: 10 (2+8, IP extension)
  max_ip_resolution: 6 MP
capabilities:
- capability: human_vehicle_classification
  support:
    verdict: supported
    evidence_class: FIELD_VERIFIED
  ai_location: recorder
  read:
    supported: true
    method: CGI configManager.cgi?action=getConfig&name=SmartMotionDetect
  write:
    supported: true
    method: CGI configManager.cgi?action=setConfig&name=SmartMotionDetect
    safety_class: safe_write
  verification:
    required: false
  notes: SMD Plus on 4 analog ch only; DISABLED if IP extension enabled. Human+Vehicle targets; indoor
    Vehicle disabled in field.
- capability: sensitivity_config
  support:
    verdict: supported
    evidence_class: FIELD_VERIFIED
  ai_location: recorder
  read:
    supported: true
    method: CGI configManager.cgi?action=getConfig&name=SmartMotionDetect (Sensitivity field)
  write:
    supported: true
    method: CGI configManager.cgi?action=setConfig&name=SmartMotionDetect (Sensitivity field)
    safety_class: safe_write
  verification:
    required: false
  notes: Per-channel SMD sensitivity; Ch3 raised to High in field.
