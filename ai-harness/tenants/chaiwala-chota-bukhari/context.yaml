version: 1
id: chaiwala_chota_bukhari
status: IMPLEMENTED
kind: tenant_site_overlay
site_type: restaurant
inherits:
  - ../../site-types/restaurant.yaml

identity:
  tenant: chaiwala
  display_name: Chai Wala - Chota Bukhari
  branch: Chota Bukhari, DHA Phase 6, Karachi
  business_type: late-night chai cafe and casual restaurant
  service_style: waiter-led outdoor dine-in with takeaway, delivery and car-side service

service_day:
  canonical_open: "16:00"
  canonical_close: "04:00"
  overnight: true
  days_iso: [1, 2, 3, 4, 5, 6, 7]
  authority: configured_watchlog_context
  monitoring_truth:
    fully_monitored_rule: >-
      Only call a completed service day fully monitored when the full configured
      4:00 PM to 4:00 AM window has no unrecovered or unverified monitoring time.
    historical_authority: >-
      Service-day monitoring coverage plus the completed visual review/saved report
      outrank generic calendar-day coverage and an empty event index.
    empty_event_index_rule: >-
      An empty event index does not mean there is no retained evidence when reviewed
      snapshots or a saved report exist for the same service day.
    unverified_language: >-
      Unverified time means WatchLog cannot confirm what happened in that period;
      never describe it as no activity.

camera_role_map:
  Floor 1: {role: dining_floor, target_sampling_seconds: 60}
  Floor 2: {role: dining_floor, target_sampling_seconds: 60}
  Shop Front:
    role: service_handoff
    target_sampling_seconds: 90
    note: not the customer entrance
  Kitchen: {role: kitchen, target_sampling_seconds: 120}
  Cash Counter:
    role: cash_counter
    target_sampling_seconds: 180
    note: customer queue is mostly outside frame
  Back Entrance: {role: service_access, sampling: event}
  Office View: {role: office_security, sampling: event}
  Office Camera: {role: office_security, sampling: event}

table_model:
  floor_1_calibrated_anchors: 13
  floor_2_calibrated_anchors: 10
  total_calibrated_anchors: 23
  nominal_anchor_capacity: 4
  movable: true
  can_combine: true
  rule: >
    Preserve table keys when adjacent tables are joined. Use the same combined_group
    for one larger party. If movement leaves the calibrated zone, lower table-tracking
    confidence and recommend recalibration instead of inventing identity.

customer_counting:
  primary_metric: visible_diners
  unique_footfall_available: false
  reason: no configured camera currently provides a clean customer-entry counting line
  accuracy_status: not_calibrated_against_human_ground_truth
  validation_required: >
    Compare representative Floor 1 and Floor 2 frames against manual visible-diner
    counts before publishing an accuracy percentage.

known_review_focus:
  - id: dining_floor_front_lights
    status: owner_reported_unverified
    applies_to: [Floor 1, Floor 2]
    concern: bright lights in front of the floor cameras may create glare or overexposure
    required_evidence: repeated analytics_quality scores from processed frames
    action_if_confirmed: >
      Re-angle the camera or redirect/shield the light source, then revalidate after dark.
  # Items below were added 2026-09-28 from a server-side pass over all 990 snapshots of the 27 and 28 Sep
  # service days. Images were not sent to any external model.
  - id: sampling_interval_below_target
    status: observed
    evidence_window: "2026-09-27..2026-09-28 service days"
    applies_to: all cameras
    finding: >
      The actual capture interval is ~300 s on all 8 cameras, vs targets of 60 s (floors), 90 s (Shop
      Front), 120 s (Kitchen) and 180 s (Cash Counter). Back Entrance, Office View and Office Camera
      ("sampling: event") receive the same timed captures, because the recorder produced no person/motion
      alerts in 7 days.
    consequence: >
      Session, dwell and time-to-food metrics have ~5-minute resolution. Report them as coarse ranges,
      not precise minutes.
    action: Raise floor-camera capture cadence to the target, or keep labelling timing metrics as coarse.
  - id: closed_period_unmonitored
    status: observed_repeated
    evidence_window: "2026-09-27..2026-09-28"
    finding: >
      Monitoring stopped at 03:22 and resumed at 16:38 (site PC powered off after closing). The whole
      closed period was unmonitored, and the 16:00 opening and 04:00 closing edges fell outside coverage.
    action: Keep the site PC and agent on 24/7. Until then, closed-period security and opening/closing discipline are unknown.
  - id: recorder_person_events_absent
    status: observed
    finding: >
      The DS-7608NI-Q1 datasheet (V4.71.200, 2022-10-31) lists Motion Detection 2.0 human/vehicle
      analysis on 4 channels only. Line crossing/intrusion are camera-side VCA functions. No person or
      motion alert has been received from this recorder. WatchLog has no verified capability record for this model yet.
    source: https://assets.hikvision.com/prd/public/all/doc/m000000569/Datasheet-of-DS-7608NI-Q1-NVRD_V4.71.200_20221031.pdf
    action: >
      Choose which 4 cameras get the recorder's human/vehicle detection, for example Back Entrance,
      Cash Counter and the two office views.
    internal_note: >
      Add the model to the capability KB via migration, not by hand-editing device-knowledge files.
  - id: db_camera_purpose_conflicts
    status: config_alignment_required
    finding: >
      site_business_context lists Shop Front as a reception camera and Back Entrance as an entrance camera.
      Kitchen carries purpose 'restricted', which is also a restricted purpose and a critical camera. This
      conflicts with the roles above: Shop Front is service_handoff and not the customer entrance, Back
      Entrance is service access and not customer footfall, and Kitchen is kitchen and not a restricted-area
      alarm source.
    action: Align site_business_context purposes/role lists with camera_role_map after owner approval.
  - id: cash_counter_zone_uncalibrated
    status: observed
    finding: >
      A till zone copied from an old frame placed the staff seat just outside the zone, which produced a
      false "unattended" reading. Whole-view presence was 90-97% of checks.
    action: >
      Have the owner/installer draw and confirm staff-side zones. Until then report "someone visible at
      the counter", not staff attendance.
  - id: low_light_and_soft_focus
    status: observed_repeated
    applies_to: [Office View, Back Entrance]
    finding: >
      Office View is the darkest view (median brightness 59 vs ~120 elsewhere, ~125 frames). Back Entrance
      has the lowest sharpness of all views.
    action: Check lighting in the office and the Back Entrance lens/focus, then revalidate.

owner_priorities:
  - visible diner activity and peak periods
  - occupied tables and table utilization by floor and table
  - estimated table sessions and estimated covers
  - observed seated-to-first-food-visible timing
  - served versus occupied table sessions
  - Shop Front handoff pressure
  - Cash Counter activity and unattended periods
  - Kitchen continuity and relative pressure
  - Back Entrance service/delivery activity
  - office and after-hours security context
  - monitoring coverage and analytics quality
  - glare, occlusion, obstruction, camera angle and count/table confidence

report_profile:
  id: chaiwala_restaurant_ops_v1
  tabs: [Today, Yesterday, Last 7 days, Last 30 days]
  today:
    focus: [coverage, analytics quality, restaurant KPIs, hourly demand, floors, tables, service timing, pressure, exceptions, improvements]
  yesterday:
    focus: [completed service day, analytics quality, restaurant KPIs, security evidence, improvements]
  last_7_days:
    focus: [previous-period comparison, daily trend, demand by hour, floors, tables, service timing, quality issues, improvements]
  last_30_days:
    focus: [previous-period comparison, weekly trend, weekday pattern, demand by hour, tables, service timing, recurring quality issues, improvements]


reporting_contract:
  archive: ./reporting/daily-reports/
  visual_method: ./reporting/methods/visual-snapshot-analysis.md
  daily_summary_name: summary.md
  daily_detailed_name: detailed-report.md
  rule: >
    Generate the report only after the required evidence pass is complete. Store it under
    daily-reports/<business-or-service-date>/ using the configured business/service-day key.

runtime_facts:
  source: watchlog_database
  do_not_duplicate_here: [tenant_uuid, site_uuid, camera_uuid, live_observations, live_coverage, current_events, current_agent_version, current_ai_egress_permission]
