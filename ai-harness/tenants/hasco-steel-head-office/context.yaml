version: 1
id: hasco_steel_head_office
status: IMPLEMENTED
kind: tenant_site_overlay
site_type: office
inherits:
  - ../../site-types/office.yaml

identity:
  tenant: HASCO Steel
  display_name: Head Office
  timezone: Asia/Karachi

working_day:
  open: "08:00"
  close: "19:00"
  overnight: false
  days_iso: [1, 2, 3, 4, 5]

camera_role_map:
  Entrance Corridor:
    role: entrance
    watch_for: [arrival/departure activity, after-hours movement, unusual corridor dwell]
  Reception:
    role: reception
    watch_for: [visitor arrivals, waiting/dwell, reception occupancy, unattended periods]
  Private Office:
    role: management_office
    watch_for: [occupancy, unusual access, after-hours presence]
  Office Interior:
    role: general_office
    watch_for: [office activity level, busy/quiet periods, after-hours presence]
  Manager Office:
    role: management_office
    watch_for: [management-office occupancy, unusual access, after-hours presence]
  Parking:
    role: parking
    watch_for: [vehicle arrival/departure activity, prolonged vehicle presence, after-hours parking]
  Internal Corridor:
    role: corridor
    watch_for: [movement flow, after-hours activity, unusual dwell]
  External Entrance:
    role: perimeter
    watch_for: [arrival/departure flow, after-hours access, entrance dwell, external access]

camera_identity:
  physical_camera_count: 8
  canonical_only: true
  mapping_status: configured_names_not_yet_visually_verified
  rule: >
    The role names above come from configuration. Confirm them with a visual setup pass on representative
    working-day images before role-specific conclusions. Run the pass under the site's egress policy:
    locally or on WatchLog-controlled compute unless the site has opted in to external processing.

# Dated, evidence-backed review items (added 2026-09-28). Re-check against runtime data before repeating.
known_review_focus:
  - id: working_day_evidence_absent
    status: observed
    evidence_window: "2026-09-23..2026-09-28"
    finding: >
      Only 132 timed snapshots exist, all on Saturday 26 Sep (a configured non-working day), 15:16-18:38.
      Since 18:38 that day the agent has reported the recorder unreachable. No recorder person/motion
      alerts have been received.
    action: >
      Restore recorder connectivity (power, IP, network path from the site PC). No working-day report or
      baseline is possible until then.
  - id: recorder_person_events_absent
    status: observed
    finding: >
      The DS-7608NI-Q1 datasheet (V4.71.200, 2022-10-31) lists Motion Detection 2.0 human/vehicle
      analysis on 4 channels only. Line crossing/intrusion are camera-side VCA functions. WatchLog has no verified
      capability record for this model yet.
    source: https://assets.hikvision.com/prd/public/all/doc/m000000569/Datasheet-of-DS-7608NI-Q1-NVRD_V4.71.200_20221031.pdf
    action: >
      Choose which 4 cameras get the recorder's human/vehicle detection, for example External Entrance,
      Entrance Corridor, Reception and Parking.
    internal_note: Add the model to the capability KB via migration.

owner_priorities:
  - office opening and closing activity
  - visitor arrival and reception waiting
  - after-hours activity in private and manager offices
  - entrance and corridor access patterns
  - parking and vehicle activity
  - unusual dwell or access
  - camera, recorder, recording and monitoring health
  - camera angle, obstruction and coverage improvements

report_profile:
  id: office_ops_v1
  tabs: [Today, Yesterday, Last 7 days, Last 30 days]

truth_boundaries:
  - do not infer employee identity, visitor identity, employment status or wrongdoing from appearance
  - detections and episodes are not unique people
  - visitor language requires reception/entrance context
  - missing monitoring is missing evidence, not no activity


reporting_contract:
  archive: ./reporting/daily-reports/
  visual_method: ./reporting/methods/visual-snapshot-analysis.md
  daily_summary_name: summary.md
  daily_detailed_name: detailed-report.md
  rule: >
    Generate the report only after the required evidence pass is complete. Store it under
    daily-reports/<business-or-service-date>/ using the configured business/service-day key.

runtime_facts:
  source: watchlog_database
  do_not_duplicate_here: [tenant_uuid, site_uuid, camera_uuid, live_events, live_incidents, live_coverage, current_agent_version]
