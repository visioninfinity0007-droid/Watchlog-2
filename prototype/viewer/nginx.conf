server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # NOTE: every add_header for this location must live in THIS
        # block. nginx does not merge add_header down into a child block
        # that declares any add_header of its own - a server-level set
        # would be silently discarded here, headers and all.
        add_header Cache-Control          "no-store"          always;
        add_header X-Robots-Tag           "noindex, nofollow" always;
        add_header X-Frame-Options        "DENY"              always;
        add_header X-Content-Type-Options "nosniff"           always;
        add_header Referrer-Policy        "no-referrer"       always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
