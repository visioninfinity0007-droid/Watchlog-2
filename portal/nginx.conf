server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Static export writes /login/index.html etc, so try the
        # directory form before falling back.
        try_files $uri $uri/ $uri/index.html /index.html;

        # Every add_header for this location must be declared HERE.
        # nginx does not inherit them into a block that sets any of its
        # own, so a server-level set would be silently dropped.
        add_header X-Frame-Options        "DENY"    always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "same-origin" always;
        add_header X-Robots-Tag           "noindex, nofollow" always;
    }

    # Hashed filenames, safe to cache hard.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
}
